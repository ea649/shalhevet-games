:root{
  --purple:#4F3795;--magenta:#AA479A;--pink:#EE3461;--cyan:#08B7D5;
  --grad:linear-gradient(120deg,#4F3795 0%,#AA479A 52%,#EE3461 100%);
  --ok:#22B573;--bad:#EE3461;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"Anomalia","Jabu",Arial,sans-serif;font-weight:600;color:#2B2250;
  background:#F6F1FB;
  background-image:radial-gradient(circle at 12% 88%,rgba(8,183,213,.18) 0,transparent 34%),
                   radial-gradient(circle at 92% 10%,rgba(238,52,97,.16) 0,transparent 32%),
                   radial-gradient(circle at 60% 55%,rgba(170,71,154,.10) 0,transparent 45%);
  min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none;
}
.logo-otz{position:fixed;top:14px;left:16px;width:clamp(96px,13vw,150px);z-index:5}
.logo-shl{position:fixed;bottom:10px;right:14px;width:clamp(120px,14vw,190px);z-index:5;opacity:.95}
.wrap{max-width:1100px;margin:0 auto;padding:12px 18px 14px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.topbar{width:100%;display:flex;justify-content:center;align-items:center;min-height:64px;margin-bottom:6px}
.progress{display:flex;gap:10px;direction:rtl}
.progress span{width:22px;height:22px;border-radius:50%;background:#E3DAF0;border:3px solid #fff;box-shadow:0 2px 6px rgba(79,55,149,.18);transition:.3s}
.progress span.done{background:var(--grad)}
.progress span.now{background:var(--cyan);transform:scale(1.25)}

.screen{display:none;width:100%;flex:1;flex-direction:column;align-items:center}
.screen.show{display:flex;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* start */
.hero{margin-top:4vh;background:var(--grad);color:#fff;border-radius:44px;padding:clamp(26px,5vw,54px) clamp(22px,6vw,70px);text-align:center;box-shadow:0 18px 40px rgba(79,55,149,.30);max-width:820px;width:100%;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.10);top:-90px;right:-70px}
.hero .tag{display:inline-block;background:rgba(255,255,255,.2);border-radius:40px;padding:6px 22px;font-size:clamp(18px,2.4vw,24px)}
.hero h1{font-family:"Jabu","Anomalia",sans-serif;font-weight:900;font-size:clamp(40px,7vw,78px);margin:16px 0 6px;line-height:1.15}
.hero p{font-size:clamp(22px,3vw,32px);margin:6px 0 0}
.letters-row{display:flex;gap:clamp(8px,1.6vw,16px);justify-content:center;margin:26px 0 6px;flex-wrap:wrap}
.letters-row b{width:clamp(56px,8vw,82px);height:clamp(56px,8vw,82px);border-radius:24px;background:#fff;color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:clamp(36px,5.4vw,56px);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.btn{font-family:inherit;font-weight:600;border:0;cursor:pointer;border-radius:999px;padding:16px 46px;font-size:clamp(26px,3.4vw,36px);color:#fff;background:var(--cyan);box-shadow:0 8px 0 #0790A8,0 14px 26px rgba(8,183,213,.35);transition:transform .12s}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #0790A8}
.btn.pink{background:var(--pink);box-shadow:0 8px 0 #B81F45,0 14px 26px rgba(238,52,97,.35)}
.btn.pink:active{box-shadow:0 3px 0 #B81F45}
.start-btn{margin-top:30px}

/* round */
.sound-card{background:var(--grad);color:#fff;border-radius:40px;padding:clamp(16px,2.6vw,26px) clamp(22px,4vw,44px);display:flex;align-items:center;gap:clamp(14px,3vw,30px);box-shadow:0 14px 30px rgba(79,55,149,.28);max-width:900px;width:100%;justify-content:center}
.big-letter{flex:none;width:clamp(96px,13vw,140px);height:clamp(96px,13vw,140px);border-radius:34px;background:#fff;color:var(--pink);font-size:clamp(70px,10vw,110px);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 rgba(0,0,0,.14);line-height:1}
.sound-text{font-size:clamp(34px,5.4vw,60px);line-height:1.25;letter-spacing:1px}
.speak{flex:none;width:clamp(64px,8vw,84px);height:clamp(64px,8vw,84px);border-radius:50%;border:0;background:rgba(255,255,255,.22);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.speak:active{transform:scale(.92)}
.speak svg{width:58%;height:58%;fill:#fff}
.question{font-size:clamp(32px,5vw,54px);margin:clamp(18px,3vh,30px) 0 clamp(14px,2.4vh,24px);color:var(--purple);text-align:center}
.question em{font-style:normal;color:var(--pink)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2.4vw,28px);width:100%;max-width:980px}
.card{position:relative;background:#fff;border-radius:36px;border:5px solid transparent;padding:clamp(10px,1.6vw,18px) clamp(8px,1.2vw,14px) clamp(12px,1.8vw,18px);cursor:pointer;display:flex;flex-direction:column;align-items:center;box-shadow:0 10px 0 #E3DAF0,0 16px 30px rgba(79,55,149,.14);transition:transform .15s,border-color .2s;touch-action:manipulation}
.card:active{transform:scale(.97)}
.card img{width:100%;aspect-ratio:1/1;max-height:max(120px,calc(100vh - 510px));object-fit:contain;border-radius:24px;pointer-events:none}
.card .word{font-size:clamp(34px,5vw,56px);margin-top:4px;line-height:1.2}
.card.right{border-color:var(--ok);animation:pop .5s}
.card.wrong{border-color:var(--bad);animation:shake .45s}
.card.locked{pointer-events:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.mark{position:absolute;top:-18px;left:-18px;width:clamp(64px,8vw,92px);height:clamp(64px,8vw,92px);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(0,0,0,.2);animation:stamp .35s cubic-bezier(.3,1.6,.6,1)}
.mark svg{width:60%;height:60%;stroke:#fff;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mark.v{background:var(--ok)}
.mark.x{background:var(--bad)}
@keyframes stamp{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
.toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:20;
  font-family:"Jabu","Anomalia",sans-serif;font-weight:900;font-size:clamp(46px,8vw,96px);color:#fff;padding:18px 56px;border-radius:40px;white-space:nowrap;transition:transform .3s cubic-bezier(.3,1.6,.6,1),opacity .25s}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.good{background:var(--grad);box-shadow:0 18px 40px rgba(170,71,154,.45)}
.toast.oops{background:#fff;color:var(--bad);border:6px solid var(--bad);font-family:"Anomalia",sans-serif;font-weight:600}
.next-wrap{height:96px;display:flex;align-items:center;justify-content:center;margin-top:10px}
.next-wrap .btn{display:none}
.next-wrap .btn.show{display:inline-block;animation:fade .4s}

/* end */
.end-card{margin-top:4vh;text-align:center;background:#fff;border-radius:44px;padding:clamp(26px,5vw,50px);box-shadow:0 18px 40px rgba(79,55,149,.18);max-width:820px;width:100%}
.end-card .trophy{font-size:clamp(70px,10vw,110px);line-height:1}
.end-card h2{font-family:"Jabu","Anomalia",sans-serif;font-weight:900;font-size:clamp(42px,6.5vw,72px);margin:10px 0;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.25}
.end-card p{font-size:clamp(28px,4vw,42px);margin:6px 0 26px;color:var(--purple)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-30px;width:14px;height:22px;border-radius:4px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-width:640px){
  .cards{grid-template-columns:repeat(3,1fr);gap:10px}
  .card{border-radius:24px;border-width:4px}
  .sound-card{border-radius:30px}
}
@media (max-height:1px){
  .card img{max-height:30vh}
}
</style>
</head>

/* ---------- קול ---------- */
let heVoice = null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  heVoice = vs.find(v=>/^he|^iw/i.test(v.lang) && /google/i.test(v.name)) || vs.find(v=>/^he|^iw/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate){
  if(!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "he-IL"; if(heVoice) u.voice = heVoice;
    u.rate = rate || 0.85; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
let actx = null;
function tone(freqs, dur, type){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    freqs.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i*dur*0.8;
      o.type = type||"sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.05);
    });
  }catch(e){}
}
const chime = () => tone([659,784,1047],0.22,"triangle");

  const p = $("progress"); p.innerHTML = "";
  ROUNDS.forEach((_,i)=>{ const s=document.createElement("span"); if(i<r) s.className="done"; else if(i===r && $("s-round").classList.contains("show")) s.className="now"; p.appendChild(s); });
}
let toastT;
function toast(text, kind){
  const t = $("toast"); t.textContent = text; t.className = "toast " + kind;
  void t.offsetWidth; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 1300);
}
const SVG_V = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const SVG_X = '<svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>';

function playIntro(){
  const R = ROUNDS[r];
  say(R.say + ". " + R.qSay, 0.8);
}
function startRound(){
  const R = ROUNDS[r]; found = 0;
  $("bigLetter").textContent = R.letter;
  $("soundText").textContent = R.sound;
  $("question").innerHTML = R.q;
  $("nextBtn").classList.remove("show");
  $("nextBtn").textContent = r === ROUNDS.length-1 ? "סיום ★" : "הַבָּא ←";
  const box = $("cards"); box.innerHTML = "";
  R.opts.forEach(o=>{
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = '<img src="'+IMG[o.img]+'" alt=""><div class="word">'+o.w+'</div>';
    c.addEventListener("click", ()=>choose(c,o));
    box.appendChild(c);
  });
  show("s-round"); drawProgress();
  setTimeout(playIntro, 350);
}
function choose(card, o){
  const R = ROUNDS[r];
  card.querySelectorAll(".mark").forEach(m=>m.remove());
  const m = document.createElement("div");
  if(o.ok){
    card.classList.remove("wrong"); card.classList.add("right","locked");
    m.className = "mark v"; m.innerHTML = SVG_V; card.appendChild(m);
    chime();
    const p = PRAISE[praiseIx++ % PRAISE.length];
    toast(p.t, "good"); say(o.say + "! " + p.s, 0.9);
    found++;
    if(found === R.opts.filter(x=>x.ok).length){
      document.querySelectorAll("#cards .card").forEach(c=>c.classList.add("locked"));
      setTimeout(()=>{ $("nextBtn").classList.add("show"); burst(40); }, 700);
    }
  }else{
    card.classList.remove("wrong"); void card.offsetWidth; card.classList.add("wrong");
    m.className = "mark x"; m.innerHTML = SVG_X; card.appendChild(m);
    buzz();
    toast(OOPS.t, "oops"); say(o.say + ". " + OOPS.s, 0.9);
    setTimeout(()=>{ m.remove(); card.classList.remove("wrong"); }, 1500);
  }
}
function burst(n){
  const box = $("confetti"), cols = ["#4F3795","#AA479A","#EE3461","#08B7D5","#FFC93C"];
  for(let i=0;i<n;i++){
    const e = document.createElement("i");
    e.style.left = Math.random()*100+"vw"; e.style.background = cols[i%cols.length];
    e.style.animationDuration = (1.8+Math.random()*1.8)+"s"; e.style.animationDelay = (Math.random()*.5)+"s";
    box.appendChild(e); setTimeout(()=>e.remove(), 4200);
  }
}
$("startBtn").onclick = ()=>{ tone([523],0.05); r = 0; startRound(); };
$("speakBtn").onclick = playIntro;
$("nextBtn").onclick = ()=>{
  r++;
  if(r < ROUNDS.length){ startRound(); }
  else { show("s-end"); drawProgress(); chime(); burst(120); say("כְּתִיבָה וַחֲתִימָה טוֹבָה! מְצֻיָּן!", 0.85); }
};
$("againBtn").onclick = ()=>{ r = 0; startRound(); };
drawProgress();
</script>
