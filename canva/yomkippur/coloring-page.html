<meta charset="utf-8">
<title>יום הכיפורים – דף מלווה לתלמיד</title>
<style>
  :root{--indigo:#4F3795;--magenta:#AA479A;--pink:#EE3461;--cyan:#08B7D5;
        --yellow:#FCB918;--lime:#BCCB33;--ink:#1B1533}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#eef1f7}
  .page{
    position:relative;width:2480px;height:3508px;overflow:hidden;background:#fff;
    direction:rtl;font-family:"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;
    margin:0 auto 40px;padding:120px 120px 150px;
    display:flex;flex-direction:column;
  }
  .bh{position:absolute;left:120px;top:80px;font-size:44px;color:#8C86A8;font-family:Arial,sans-serif}
  .titlebar{
    background:linear-gradient(135deg,#4F3795 0%,#AA479A 55%,#EE3461 100%);
    border-radius:70px;padding:44px 60px;text-align:center;margin-bottom:26px;
    box-shadow:0 16px 34px rgba(79,55,149,.20);
  }
  .titlebar h1{font-size:140px;color:#fff;line-height:1.2}
  .lead{text-align:center;font-size:62px;color:#5C5480;margin-bottom:42px;line-height:1.35}
  .grid{
    flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr);
    gap:36px;
  }
  .box{
    position:relative;border:6px solid #D9D3EF;border-radius:56px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:26px;
  }
  .box .art{position:relative;flex:1;width:100%;display:grid;place-items:center;min-height:0}
  .box .art img{max-height:100%;max-width:80%;object-fit:contain}
  .cap{font-size:64px;color:var(--ink);text-align:center;line-height:1.2}
  .n{
    position:absolute;top:-22px;right:40px;width:86px;height:86px;border-radius:28px;
    display:grid;place-items:center;font-size:50px;color:#fff;
    background:linear-gradient(135deg,#4F3795 0%,#AA479A 100%);
  }
  .xmark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .xmark svg{width:38%;height:80%}
  .greet{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .greet span{transform:rotate(-4deg);font-size:44px;color:#4A4368;text-align:center;max-width:44%;line-height:1.25}
  .logo{position:absolute;left:120px;bottom:56px;width:280px;opacity:.92}
  img{display:block}
</style>

<div class="page" data-document-role="page" data-label="דף מלווה – יום הכיפורים">
  <div class="bh">ב"ה</div>
  <div class="titlebar"><h1>יוֹם הַכִּפּוּרִים</h1></div>
  <div class="lead">מָצְאוּ אֶת הָאִיּוּר הַמַּתְאִים לְכָל מִנְהָג שֶׁלָּמַדְנוּ – וְצִבְעוּ אוֹתוֹ!</div>

  <div class="grid">
    <div class="box"><div class="n">1</div>
      <div class="art"><img src="https://raw.githubusercontent.com/ea649/shalhevet-games/main/canva/yomkippur/img/cl_seuda.png" alt=""></div>
      <div class="cap">סְעוּדָה מַפְסֶקֶת</div></div>

    <div class="box"><div class="n">2</div>
      <div class="art"><img src="https://raw.githubusercontent.com/ea649/shalhevet-games/main/canva/yomkippur/img/cl_kaparot.png" alt=""></div>
      <div class="cap">כַּפָּרוֹת בְּכֶסֶף</div></div>

    <div class="box"><div class="n">3</div>
      <div class="art"><img src="https://raw.githubusercontent.com/ea649/shalhevet-games/main/canva/yomkippur/img/cl_tzedaka.png" alt=""></div>
      <div class="cap">צְדָקָה</div></div>

    <div class="box"><div class="n">4</div>
      <div class="art">
        <img src="https://raw.githubusercontent.com/ea649/shalhevet-games/main/canva/yomkippur/img/cl_michtav.png" alt="">
        <div class="greet"><span>גְּמַר חֲתִימָה טוֹבָה</span></div>
      </div>
      <div class="cap">גְּמַר חֲתִימָה טוֹבָה</div></div>

    <div class="box"><div class="n">5</div>
      <div class="art">
        <img src="https://raw.githubusercontent.com/ea649/shalhevet-games/main/canva/yomkippur/img/cl_ochel.png" alt="">
        <div class="xmark"><svg viewBox="0 0 100 100"><path d="M18 18 L82 82 M82 18 L18 82" stroke="#1B1533" stroke-width="9" stroke-linecap="round" fill="none"/></svg></div>
      </div>
      <div class="cap">צוֹם</div></div>

    <div class="box"><div class="n">6</div>
      <div class="art"><img src="https://raw.githubusercontent.com/ea649/shalhevet-games/main/canva/yomkippur/img/cl_slippers.png" alt=""></div>
      <div class="cap">נַעֲלֵי בַּד</div></div>

    <div class="box"><div class="n">7</div>
      <div class="art"><img src="https://raw.githubusercontent.com/ea649/shalhevet-games/main/canva/yomkippur/img/cl_tefila.png" alt=""></div>
      <div class="cap">תְּפִלָּה בְּבֵית הַכְּנֶסֶת</div></div>

    <div class="box"><div class="n">8</div>
      <div class="art"><img src="https://raw.githubusercontent.com/ea649/shalhevet-games/main/canva/yomkippur/img/cl_shofar.png" alt=""></div>
      <div class="cap">תְּקִיעַת שׁוֹפָר</div></div>
  </div>

  <img class="logo" src="https://raw.githubusercontent.com/ea649/shalhevet-games/main/canva/assets/shalhevet-logo.png" alt="שלהבות חב״ד">
</div>
