<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

<title>משחקים – שלהבות חב"ד</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{

}
h1{font-size:clamp(32px,6vw,56px);color:#E5326A;margin-bottom:8px}

ul{list-style:none;display:grid;gap:16px;max-width:620px}
a.card{

a.card:hover{transform:translateY(-3px);border-color:#E5326A}
a.card strong{font-size:clamp(20px,3vw,27px);font-weight:700}
a.card span{font-size:15px;color:#5B6684}
a.card .go{font-size:26px;color:#E5326A}
footer{margin-top:44px;font-size:14px;color:#8A8264}

</head>
