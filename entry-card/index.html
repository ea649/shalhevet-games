<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>כרטיס כניסה לשיעור – שלהבות חב"ד</title>

<style>
@font-face{font-family:'Tamlil';src:url(../fonts/FbTamlil-Regular.otf) format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'Tamlil';src:url(../fonts/FbTamlil-Medium.otf) format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:'Tamlil';src:url(../fonts/FbTamlil-Bold.otf) format('opentype');font-weight:700;font-display:swap}
@font-face{font-family:'TamlilCond';src:url(../fonts/FbTamlilCondensed-Black.otf) format('opentype');font-weight:900;font-display:swap}

:root{
  --indigo:#513996; --magenta:#AA479A; --pink:#EE2F62; --cyan:#1EBCD7;
  --yellow:#FDB916; --lime:#BDCC32; --orange:#F36F29; --ink:#1B1533; --muted:#6B6486;
  --page:#FFFFFF;
  --g-brand:linear-gradient(120deg,#1EBCD7 0%,#513996 45%,#AA479A 72%,#EE2F62 100%);
  --gut:clamp(14px,2.4vw,32px);
}
/* wide screens: side gutters hold the two characters */
@media (min-width:1100px){ :root{--gut:clamp(190px,17vw,330px)} }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:'Tamlil','Segoe UI',Arial,sans-serif;font-weight:500;color:var(--ink);
  background:var(--page);
  padding:clamp(10px,1.8vh,20px) var(--gut) 28px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.page{margin:0 auto;display:grid;gap:clamp(14px,2vh,22px);position:relative;z-index:2}
@media (max-width:1099px){ .side-char{display:none} }

/* ---------- toolbar ---------- */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tools .logo{height:clamp(34px,5.2vh,54px);width:auto}
.tools .btns{display:flex;flex-wrap:wrap;gap:8px}
.tb{
  border:0;background:#fff;color:var(--indigo);border-radius:999px;
  padding:8px 18px;font:500 16px 'Tamlil',sans-serif;cursor:pointer;
  box-shadow:0 4px 14px rgba(81,57,150,.12), inset 0 0 0 1.5px rgba(81,57,150,.16);transition:.18s;
}
.tb:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(81,57,150,.18), inset 0 0 0 1.5px rgba(170,71,154,.5)}
.tb.main{background:var(--g-brand);color:#fff;box-shadow:0 8px 20px rgba(81,57,150,.3)}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:16px;transition:.3s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ======================================================================
   CARD – the look of the Canva work-cards:
   strong colour on top fading to a pale tint, big white title,
   and a small tab.
   ====================================================================== */
.card{
  --c:var(--magenta); --l:#FFF1FD; --tab:var(--cyan);
  position:relative;border-radius:22px;isolation:isolate;
  background:linear-gradient(180deg,var(--c) 0%,color-mix(in srgb,var(--c) 62%,var(--l)) 30%,var(--l) 86%);
  box-shadow:0 18px 34px -24px color-mix(in srgb,var(--c) 80%,#000);
}
.card.c-magenta{--c:#AA479A;--l:#FFF1FD;--tab:#1EBCD7}
.card.c-pink   {--c:#EE2F62;--l:#FFE8EE;--tab:#FDB916}
.card.c-indigo {--c:#513996;--l:#F6F2FF;--tab:#F36F29}
.card.c-cyan   {--c:#1EBCD7;--l:#F1FDFF;--tab:#FDB916}
.card.c-lime   {--c:#A9BA1E;--l:#FEFFF0;--tab:#513996}
.card.c-orange {--c:#F36F29;--l:#FFECE3;--tab:#513996}
.card.c-yellow {--c:#FDB916;--l:#FFF2D1;--tab:#EE2F62}

.tab{
  position:absolute;top:12px;left:14px;z-index:3;
  background:var(--tab);color:#fff;border-radius:9px;padding:3px 12px 4px;
  font:900 clamp(14px,1.9vh,19px)/1.1 'TamlilCond','Tamlil',sans-serif;white-space:nowrap;
  box-shadow:0 4px 10px -4px rgba(0,0,0,.35);
}
.ttl{
  display:block;text-align:center;color:#fff;
  font:900 clamp(26px,4.4vh,50px)/1 'TamlilCond','Tamlil',sans-serif;
  text-shadow:0 2px 12px color-mix(in srgb,var(--c) 70%,#000 30%);
  padding:0 8px;
}
/* the two big characters that stand beside the cards (outside them) */
.side-char{
  position:fixed;bottom:0;z-index:1;pointer-events:none;height:auto;
  width:calc(var(--gut) + 6px);max-height:72vh;object-fit:contain;object-position:bottom;
  filter:drop-shadow(0 12px 18px rgba(27,21,51,.18));
}
.side-char.r{right:-6px}
.side-char.l{left:-6px}

/* one text size for everything written inside the cards */
:root{--fs:clamp(15px,2vh,20px)}

/* editable text */
[contenteditable]{outline:none;border-radius:10px;transition:background .15s}
.editing [contenteditable]:hover{background:rgba(255,255,255,.35)}
.editing [contenteditable]:focus{background:rgba(255,255,255,.55)}
[contenteditable]:empty:before{content:attr(data-ph);color:color-mix(in srgb,var(--c) 45%,#8E88A6);font-weight:400}
.ttl[contenteditable]:empty:before{color:rgba(255,255,255,.72)}
.hint{display:block;font:italic 500 clamp(12px,1.5vh,15px) 'Tamlil',sans-serif;color:color-mix(in srgb,var(--c) 55%,#3A3350)}
.lines{font-size:var(--fs);line-height:1.55;padding:2px 6px;min-height:3em;color:var(--ink)}

/* ---------- top: timer + goal + entry ---------- */
.top{display:grid;grid-template-columns:auto 1fr;gap:clamp(14px,1.8vw,24px);align-items:stretch}
.heads{display:grid;grid-template-rows:auto 1fr;gap:clamp(12px,1.8vh,18px)}

.goal{display:flex;align-items:center;gap:12px;padding:clamp(10px,1.5vh,14px) 20px}
.goal .lbl{font:900 clamp(20px,2.7vh,28px)/1 'TamlilCond','Tamlil',sans-serif;color:#fff;white-space:nowrap;
  text-shadow:0 2px 10px rgba(160,90,0,.45)}
.goal .fill{flex:1;min-width:0;font-size:var(--fs);line-height:1.5;padding:3px 10px;min-height:1.6em;
  background:rgba(255,255,255,.7);border-radius:12px}

.entry{padding:clamp(12px,2vh,22px) clamp(16px,2vw,28px) clamp(12px,1.8vh,18px);
  display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1vh,10px)}
.entry .q{font-size:var(--fs);font-weight:500;line-height:1.5;min-height:1.5em;padding:4px 10px;text-align:center}
.entry .row{display:flex;align-items:center;gap:10px}
.entry .row .lbl{font:700 var(--fs) 'Tamlil',sans-serif;color:var(--c);white-space:nowrap}
.entry .fill{flex:1;min-width:0;font-size:var(--fs);line-height:1.5;padding:2px 8px;min-height:1.5em;
  border-bottom:2px dashed color-mix(in srgb,var(--c) 45%,transparent)}

/* ---------- timer ---------- */
.timer{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:26px;
  background:linear-gradient(180deg,#F6F2FF,#fff);
  box-shadow:0 18px 34px -24px rgba(81,57,150,.7), inset 0 0 0 2px #E6DEF8;
}
.dial{position:relative;flex:none;width:clamp(140px,21vh,220px);aspect-ratio:1;cursor:pointer}
.dial svg{width:100%;height:100%;display:block;overflow:visible}
.dial .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .t1{font:900 clamp(18px,2.6vh,24px) 'TamlilCond',sans-serif;color:var(--indigo)}
.dial .time{font:700 clamp(32px,5.4vh,54px)/1.05 'Tamlil',sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);direction:ltr}
.dial .tst{font-size:clamp(13px,1.7vh,16px);color:var(--muted)}
#ring{transition:stroke-dashoffset .95s linear}
.timer.run #glow{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.timer.end .dial{animation:shake .6s ease 3}
.timer.end .time{color:var(--pink)}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.tside{display:flex;flex-direction:column;align-items:center;gap:8px;width:clamp(150px,15vw,190px)}
.tctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:100%}
.tctl button{
  border:0;border-radius:999px;padding:7px 14px;cursor:pointer;font:700 16px 'Tamlil',sans-serif;white-space:nowrap;
  background:#fff;color:var(--indigo);box-shadow:0 3px 10px rgba(81,57,150,.14), inset 0 0 0 1.5px rgba(81,57,150,.12);
}
.tctl button.go{background:var(--g-brand);color:#fff;min-width:88px}
.dur{width:100%;border-top:1.5px dashed rgba(81,57,150,.2);padding-top:8px;display:grid;gap:6px;justify-items:center}
.dur .h{font:700 15px 'Tamlil',sans-serif;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;
  font:700 22px/1 'Tamlil',sans-serif;color:#fff;background:linear-gradient(135deg,#1EBCD7,#513996);box-shadow:0 4px 10px rgba(81,57,150,.25)}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper .val{min-width:78px;white-space:nowrap;text-align:center;font:700 22px 'Tamlil',sans-serif;color:var(--ink)}
.stepper .val input{width:40px;border:0;background:transparent;text-align:center;font:inherit;color:inherit;
  border-bottom:2px solid #D8D1EE;-moz-appearance:textfield}
.stepper .val input::-webkit-inner-spin-button{-webkit-appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.chips button{border:0;border-radius:999px;padding:4px 10px;cursor:pointer;font:500 14px 'Tamlil',sans-serif;
  color:var(--indigo);background:#EDE7FA;transition:.15s}
.chips button.on{background:var(--g-brand);color:#fff}
body.present .dur{display:none}

/* ---------- stations ---------- */
.stations{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr)) 74px;gap:clamp(14px,1.5vw,22px)}
body.present .stations{grid-template-columns:repeat(var(--cols,4),minmax(0,1fr))}
.st{
  --icon:clamp(60px,8.6vh,88px);
  display:flex;flex-direction:column;gap:6px;min-width:0;min-height:clamp(240px,36vh,380px);
  padding:calc(var(--icon) + 14px) 12px 12px;
  background:linear-gradient(180deg,var(--c) 0%,color-mix(in srgb,var(--c) 70%,var(--l)) 40%,var(--l) 92%);
}
.st .tab{background:#513996}            /* station tab is always purple */
.st .ttl{font-size:clamp(22px,3.2vh,36px);min-height:1em;word-break:break-word}
.st .hint{text-align:center;margin-top:2px}
.st .lines{flex:1}
/* intelligence icon: top-right, sitting on a white square the size of its frame */
.intel{
  position:absolute;top:8px;right:8px;z-index:3;
  width:var(--icon);aspect-ratio:1;border:0;background:none;cursor:pointer;
  border-radius:18px;transition:transform .2s;isolation:isolate;
}
.intel:hover{transform:scale(1.06) rotate(-2deg)}
.intel img{width:100%;height:100%;object-fit:contain;display:block;transform:scale(1.28)}
.intel:not(.none):before{content:"";position:absolute;inset:14% 16% 16% 16%;background:#fff;border-radius:20%;z-index:-1}
/* optional link */
.link{display:flex;align-items:center;gap:6px;margin-top:2px}
.link input{flex:1;min-width:0;border:1.5px dashed color-mix(in srgb,var(--c) 45%,transparent);border-radius:10px;
  background:rgba(255,255,255,.7);padding:4px 8px;font:500 clamp(12px,1.5vh,14px) 'Tamlil',sans-serif;color:var(--ink);direction:ltr;text-align:right}
.link input::placeholder{color:#9A93B3;direction:rtl}
.link input:focus{outline:none;border-style:solid;background:#fff}
.open{flex:none;display:inline-flex;align-items:center;gap:5px;text-decoration:none;
  background:#513996;color:#fff;border-radius:999px;padding:5px 12px;font:700 clamp(13px,1.6vh,15px) 'Tamlil',sans-serif;
  box-shadow:0 4px 10px -4px rgba(81,57,150,.6);transition:.15s}
.open:hover{transform:translateY(-1px);background:#AA479A}
.open[hidden]{display:none}
body.present .link input{display:none}
body.present .link:not(:has(.open:not([hidden]))){display:none}
.intel.none{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:2.5px dashed var(--c);background:#fff;color:var(--c);
  font:700 clamp(12px,1.5vh,14px)/1.1 'Tamlil',sans-serif;padding:4px;
}
.intel.none .plus{
  width:clamp(24px,3.4vh,32px);height:clamp(24px,3.4vh,32px);border-radius:50%;background:var(--c);color:#fff;
  display:flex;align-items:center;justify-content:center;font:700 clamp(18px,2.6vh,24px)/1 'Tamlil',sans-serif;
  animation:bob 2.2s ease-in-out infinite;
}
@keyframes bob{50%{transform:translateY(-3px)}}
body.present .intel.none{visibility:hidden}
.del{position:absolute;bottom:10px;right:10px;z-index:5;width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;
  background:#fff;color:var(--c);font:700 19px/1 'Tamlil',sans-serif;
  box-shadow:0 2px 8px rgba(27,21,51,.18);opacity:0;transition:.15s}
.st:hover .del,.del:focus{opacity:1}
.del:hover{background:var(--c);color:#fff}
@media (hover:none){.del{opacity:1}}
.add-st{
  grid-column:-2/-1;border:2.5px dashed #C9B8F2;border-radius:22px;background:#FBF9FF;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 4px;
  font:700 14px 'Tamlil',sans-serif;color:var(--indigo);transition:.2s;text-align:center;
}
.add-st:hover{background:#fff;border-color:var(--magenta);transform:translateY(-3px)}
.add-st .plus{width:40px;height:40px;border-radius:50%;background:var(--g-brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font:700 28px/1 'Tamlil',sans-serif}
body.present .del,body.present .add-st{display:none}

/* ---------- exit ---------- */
.exit{display:flex;align-items:center;gap:18px;padding:clamp(12px,1.8vh,18px) 22px}
.exit .ttl{flex:none;font-size:clamp(24px,3.4vh,40px)}
.exit .lines{flex:1;min-height:3.1em;background-color:rgba(255,255,255,.55);border-radius:12px;padding:4px 10px}

/* ---------- intelligence picker ---------- */
.pick{position:fixed;inset:0;background:rgba(27,21,51,.45);backdrop-filter:blur(4px);display:none;
  align-items:center;justify-content:center;z-index:40;padding:16px}
.pick.show{display:flex}
.pick .panel{border-radius:28px;padding:22px;max-width:660px;width:100%;
  border:3px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--g-brand) border-box;
  box-shadow:0 24px 60px rgba(27,21,51,.35);animation:pop .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.pick h3{text-align:center;font:900 30px 'TamlilCond',sans-serif;margin-bottom:14px;color:var(--indigo)}
.pick .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pick .grid button{border:2px solid transparent;background:#F8F6FE;border-radius:18px;padding:4px;cursor:pointer;transition:.15s}
.pick .grid button:hover{transform:translateY(-2px);border-color:#C9B8F2}
.pick .grid button.sel{border-color:var(--magenta)}
.pick .grid img{width:100%;display:block}
.pick .foot{display:flex;justify-content:center;gap:10px;margin-top:16px}

.foot-note{text-align:center;color:#8A83A6;font-size:15px}
body.present .tools .btns .edit-only,body.present .foot-note{display:none}

/* ---------- desktop: everything fits one screen, no scrolling ---------- */
@media (min-width:901px) and (min-height:560px){
  html,body{height:100%}
  body{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  .page{flex:1;min-height:0;width:100%;grid-template-rows:auto auto minmax(0,1fr) auto;gap:clamp(10px,1.8vh,20px)}
  .foot-note{display:none}
  .stations{min-height:0;grid-auto-rows:minmax(0,1fr)}
  .st{min-height:0}
  .st .lines{min-height:1.6em;overflow-y:auto}
  .exit .lines{max-height:3.1em;overflow-y:auto}
}

@media (max-width:900px){
  .stations,body.present .stations{grid-template-columns:repeat(2,1fr)}
  .add-st{grid-column:auto!important;grid-row:auto!important;min-height:90px}
  .exit{flex-direction:column;align-items:stretch}
}
@media (max-width:620px){
  .top{grid-template-columns:1fr}
  .timer{margin:0 auto;flex-direction:column}
  .stations,body.present .stations{grid-template-columns:1fr}
  .goal{flex-wrap:wrap;padding:14px 18px}.goal .fill{flex-basis:100%}
  .pick .grid{grid-template-columns:repeat(2,1fr)}
}
@media print{
  body{padding:0}
  .tools .btns,.tctl,.dur,.foot-note,.toast,.del,.add-st,.link input,.side-char{display:none!important}
  .intel.none{visibility:hidden}
  .page{max-width:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:8mm}
}
</style>
</head>
<body class="editing">
<img class="side-char r" src="img/char1.webp" alt="">
<img class="side-char l" src="img/char3.webp" alt="">
<div class="page">

  <div class="tools">
    <img class="logo" src="../canva/assets/shalhevet-logo.png" alt="שלהבות חב&quot;ד">
    <div class="btns">
      <button class="tb main" id="presentBtn">מצב הקרנה</button>
      <button class="tb edit-only" id="shareBtn">העתקת קישור לשיעור</button>
      <button class="tb edit-only" id="printBtn">הדפסה</button>
      <button class="tb edit-only" id="clearBtn">תבנית ריקה</button>
    </div>
  </div>

  <section class="top">
    <div class="timer" id="timer">
      <div class="dial" id="dial" title="לחיצה: הפעלה / עצירה">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1EBCD7"/><stop offset=".45" stop-color="#513996"/>
              <stop offset=".72" stop-color="#AA479A"/><stop offset="1" stop-color="#EE2F62"/>
            </linearGradient>
            <linearGradient id="gw" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#F36F29"/><stop offset="1" stop-color="#EE2F62"/>
            </linearGradient>
            <radialGradient id="fc" cx=".5" cy=".38" r=".7">
              <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#F3EFFC"/>
            </radialGradient>
            <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
          </defs>
          <circle id="glow" cx="100" cy="100" r="86" fill="none" stroke="url(#g)" stroke-width="16" opacity=".5" filter="url(#blur)"/>
          <circle cx="100" cy="100" r="86" fill="url(#fc)" stroke="#ECE7F8" stroke-width="14"/>
          <circle id="ring" cx="100" cy="100" r="86" fill="none" stroke="url(#g)" stroke-width="14"
                  stroke-linecap="round" transform="rotate(-90 100 100)"/>
          <g stroke="#CFC7E6" stroke-width="3" stroke-linecap="round" id="ticks"></g>
        </svg>
        <div class="face">
          <div class="t1">טיימר</div>
          <div class="time" id="time">15:00</div>
          <div class="tst" id="tstate">לחצו להפעלה</div>
        </div>
      </div>
      <div class="tside">
        <div class="tctl">
          <button class="go" id="goBtn">▶ הפעלה</button>
          <button id="resetBtn">↺ איפוס</button>
        </div>
        <div class="dur">
          <span class="h">כמה זמן?</span>
          <div class="stepper">
            <button id="plus" aria-label="עוד דקה">+</button>
            <span class="val"><input id="customMin" type="number" min="1" max="120" aria-label="דקות"> דק׳</span>
            <button id="minus" aria-label="פחות דקה">−</button>
          </div>
          <div class="chips" id="chips">
            <button data-min="5">5</button><button data-min="10">10</button><button data-min="15">15</button>
            <button data-min="20">20</button><button data-min="30">30</button><button data-min="45">45</button>
          </div>
        </div>
      </div>
    </div>

    <div class="heads">
      <div class="card c-yellow goal">
        <span class="lbl">מטרת השיעור:</span>
        <div class="fill" contenteditable="true" data-k="goal" data-ph="מה התלמידים ידעו / ירגישו / יעשו בסוף השיעור?"></div>
      </div>

      <div class="card c-indigo entry">
        <span class="ttl">כרטיס כניסה לשיעור</span>
        <div class="q" contenteditable="true" data-k="entry" data-ph="כתבו כאן את שאלת הפתיחה / המשימה של כרטיס הכניסה"></div>
        <div class="row">
          <span class="lbl">מסר השיעור:</span>
          <div class="fill" contenteditable="true" data-k="message" data-ph="המסר המרכזי שנרצה שיישאר"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="stations" id="stations"></section>

  <div class="card c-orange exit">
    <span class="ttl">כרטיס יציאה מהשיעור</span>
    <div class="lines" contenteditable="true" data-k="exit" data-ph="שאלת סיכום / רפלקציה לסוף השיעור"></div>
  </div>

  <p class="foot-note">לוחצים על כל שדה וכותבים · לוחצים על "בחירת אייקון" כדי לבחור אינטליגנציה לתחנה · הכול נשמר אוטומטית במחשב הזה</p>
</div>

<div class="pick" id="pick">
  <div class="panel">
    <h3>בחירת אינטליגנציה לתחנה</h3>
    <div class="grid" id="pickGrid"></div>
    <div class="foot"><button class="tb" id="noIntel">בלי אייקון</button><button class="tb main" id="pickClose">סגירה</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const INTEL = [
  ['linguistic','לשונית'],['logical','לוגית מתמטית'],['spatial','מרחבית'],['bodily','גופנית תנועתית'],
  ['musical','מוזיקלית'],['interpersonal','בין אישית'],['intrapersonal','תוך אישית'],['naturalist','נטורליסטית']
];
// look of each station card, in order (repeats after 4)
const ST_LOOK = ['c-magenta', 'c-pink', 'c-cyan', 'c-lime'];
// accept "www.x.com" or "x.com/y" as well as full addresses
function linkUrl(v){
  v = (v || '').trim(); if (!v) return '';
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
  try { const u = new URL(v); return /\./.test(u.hostname) ? u.href : ''; } catch(e) { return ''; }
}
function escAttr(v){ return String(v || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
const KEY = 'shalhevet-entry-card-v2';
const blank = () => ({goal:'',entry:'',message:'',exit:'',minutes:15,
  stations:[0,1,2,3].map(() => ({intel:'',sub:'',text:''}))});

// ---------- state: link hash > local storage > blank ----------
function decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch(e){return null}}
function encode(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
let state = null;
if (location.hash.length > 2) state = decode(location.hash.slice(1));
if (!state) { try { state = JSON.parse(localStorage.getItem(KEY)) } catch(e) {} }
if (!state || !state.stations) state = blank();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)) } catch(e) {} }

// ---------- stations ----------
const wrap = document.getElementById('stations');
const MIN_ST = 1, MAX_ST = 8;
function renderStations(){
  wrap.innerHTML = '';
  const n = state.stations.length, rows = n > 5 ? 2 : 1;
  wrap.style.setProperty('--cols', Math.ceil(n / rows));
  const present = document.body.classList.contains('present');
  state.stations.forEach((s,i) => {
    const el = document.createElement('div');
    el.className = `card st ${ST_LOOK[i % ST_LOOK.length]}`;
    const it = INTEL.find(x => x[0] === s.intel), url = linkUrl(s.link);
    el.innerHTML = `
      <span class="tab">תחנה ${i+1}</span>
      <button class="intel ${it?'':'none'}" data-i="${i}" title="${it?it[1]+' – לחצו להחלפה':'בחירת אינטליגנציה'}">
        ${it ? `<img src="img/${it[0]}.png" alt="${it[1]}">` : '<span class="plus">+</span>בחירת<br>אייקון'}
      </button>
      ${n > MIN_ST ? `<button class="del" data-del="${i}" title="מחיקת תחנה ${i+1}" aria-label="מחיקת תחנה">×</button>` : ''}
      <span class="ttl" contenteditable="${!present}" data-s="${i}" data-f="sub" data-ph="שם התחנה"></span>
      <span class="hint">מה עושים בתחנה:</span>
      <div class="lines" contenteditable="${!present}" data-s="${i}" data-f="text" data-ph="כתבו כאן את המשימה"></div>
      <div class="link">
        <input type="url" data-link="${i}" value="${escAttr(s.link)}" placeholder="🔗 קישור לתחנה (לא חובה)" aria-label="קישור לתחנה ${i+1}">
        <a class="open" href="${escAttr(url)}" target="_blank" rel="noopener" ${url?'':'hidden'}>פתיחה ↗</a>
      </div>`;
    wrap.appendChild(el);
    el.querySelector('[data-f=sub]').innerText = s.sub || '';
    el.querySelector('[data-f=text]').innerText = s.text || '';
  });
  if (n < MAX_ST) {
    const add = document.createElement('button');
    add.className = 'add-st'; add.title = 'הוספת תחנה';
    add.style.gridRow = `1 / span ${rows}`;
    add.innerHTML = '<span class="plus">+</span>הוספת<br>תחנה';
    wrap.appendChild(add);
  }
}
renderStations();
wrap.addEventListener('click', e => {
  if (e.target.closest('.add-st')) {
    state.stations.push({intel:'',sub:'',text:'',link:''}); save(); renderStations();
    return;
  }
  const d = e.target.closest('[data-del]'); if (!d) return;
  const i = +d.dataset.del, s = state.stations[i];
  if ((s.sub || s.text || s.intel || s.link) && !confirm(`למחוק את תחנה ${i+1} ואת מה שכתוב בה?`)) return;
  state.stations.splice(i, 1); save(); renderStations();
});

// ---------- editable fields ----------
document.querySelectorAll('[data-k]').forEach(el => { el.innerText = state[el.dataset.k] || '' });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.link) {
    const i = +t.dataset.link, url = linkUrl(t.value), a = t.parentElement.querySelector('.open');
    state.stations[i].link = t.value.trim();
    a.hidden = !url; a.href = url || '#';
    save(); return;
  }
  if (t.dataset.k) state[t.dataset.k] = t.innerText.trim();
  else if (t.dataset.s) state.stations[+t.dataset.s][t.dataset.f] = t.innerText.trim();
  else return;
  save();
});
document.addEventListener('paste', e => {
  if (!e.target.closest('[contenteditable]')) return;
  e.preventDefault();
  document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text'));
});
// the station title is one line – Enter moves on to the task lines
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.st .ttl')) { e.preventDefault(); e.target.parentElement.querySelector('.lines').focus(); }
});

// ---------- intelligence picker ----------
const pick = document.getElementById('pick'), grid = document.getElementById('pickGrid');
let pickFor = -1;
grid.innerHTML = INTEL.map(([k,n]) => `<button data-v="${k}" title="${n}"><img src="img/${k}.png" alt="${n}"></button>`).join('');
wrap.addEventListener('click', e => {
  const b = e.target.closest('.intel'); if (!b || document.body.classList.contains('present')) return;
  pickFor = +b.dataset.i;
  grid.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x.dataset.v === state.stations[pickFor].intel));
  pick.classList.add('show');
});
function setIntel(v){ state.stations[pickFor].intel = v; save(); renderStations(); pick.classList.remove('show'); }
grid.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setIntel(b.dataset.v); });
document.getElementById('noIntel').onclick = () => setIntel('');
document.getElementById('pickClose').onclick = () => pick.classList.remove('show');
pick.addEventListener('click', e => { if (e.target === pick) pick.classList.remove('show'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') pick.classList.remove('show'); });

// ---------- timer ----------
const ring = document.getElementById('ring'), glow = document.getElementById('glow'), C = 2 * Math.PI * 86;
ring.style.strokeDasharray = C;
const ticks = document.getElementById('ticks');
for (let i = 0; i < 12; i++) {
  const a = i * 30 * Math.PI / 180, r1 = 70, r2 = i % 3 ? 74 : 65;
  ticks.insertAdjacentHTML('beforeend',
    `<line x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${100-r2*Math.cos(a)}"/>`);
}
const timerEl = document.getElementById('timer'), timeEl = document.getElementById('time'),
      stEl = document.getElementById('tstate'), goBtn = document.getElementById('goBtn'),
      customMin = document.getElementById('customMin');
let total, left, endAt = 0, tick = null;

function fmt(s){ s = Math.max(0, Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
function draw(){
  timeEl.textContent = fmt(left);
  ring.style.strokeDashoffset = C * (1 - left / total);
  const warn = left <= 60 && left > 0;
  ring.setAttribute('stroke', warn ? 'url(#gw)' : 'url(#g)');
  glow.setAttribute('stroke', warn ? 'url(#gw)' : 'url(#g)');
}
function setMinutes(m){
  m = Math.min(120, Math.max(1, Math.round(m) || 15));
  stop(); total = left = m * 60; state.minutes = m; save();
  customMin.value = m; timerEl.classList.remove('end','run');
  document.querySelectorAll('[data-min]').forEach(b => b.classList.toggle('on', +b.dataset.min === m));
  document.getElementById('minus').disabled = m <= 1;
  document.getElementById('plus').disabled = m >= 120;
  stEl.textContent = 'לחצו להפעלה'; goBtn.textContent = '▶ הפעלה';
  ring.style.transition = 'none'; draw(); ring.getBoundingClientRect(); ring.style.transition = '';
}
function start(){
  if (left <= 0) setMinutes(state.minutes);
  endAt = Date.now() + left * 1000; timerEl.classList.remove('end'); timerEl.classList.add('run');
  tick = setInterval(() => {
    left = (endAt - Date.now()) / 1000;
    if (left <= 0) { left = 0; draw(); finish(); return; }
    draw();
  }, 250);
  goBtn.textContent = '❚❚ עצירה'; stEl.textContent = 'הזמן רץ…';
}
function stop(){ if (tick) { clearInterval(tick); tick = null; } }
function pause(){ stop(); timerEl.classList.remove('run'); goBtn.textContent = '▶ המשך'; stEl.textContent = 'בהשהיה'; }
function toggle(){ tick ? pause() : start(); }
function finish(){
  stop(); timerEl.classList.remove('run'); timerEl.classList.add('end');
  goBtn.textContent = '▶ שוב'; stEl.textContent = 'הזמן נגמר!';
  chime();
}
function chime(){
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, .28, .56].forEach((d, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = [784, 988, 1175][i];
      g.gain.setValueAtTime(0, ac.currentTime + d);
      g.gain.linearRampToValueAtTime(.3, ac.currentTime + d + .02);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + d + .9);
      o.connect(g).connect(ac.destination); o.start(ac.currentTime + d); o.stop(ac.currentTime + d + 1);
    });
  } catch(e) {}
}
goBtn.onclick = toggle;
document.getElementById('dial').onclick = toggle;
document.getElementById('resetBtn').onclick = () => setMinutes(state.minutes);
document.getElementById('plus').onclick = () => setMinutes(state.minutes + 1);
document.getElementById('minus').onclick = () => setMinutes(state.minutes - 1);
document.querySelectorAll('[data-min]').forEach(b => b.onclick = () => setMinutes(+b.dataset.min));
customMin.addEventListener('change', () => setMinutes(+customMin.value));
setMinutes(state.minutes || 15);

// ---------- toolbar ----------
const toast = document.getElementById('toast');
function say(t){ toast.textContent = t; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2200); }
const presentBtn = document.getElementById('presentBtn');
function setPresent(on){
  document.body.classList.toggle('present', on);
  document.body.classList.toggle('editing', !on);
  document.querySelectorAll('[contenteditable]').forEach(el => el.contentEditable = on ? 'false' : 'true');
  presentBtn.textContent = on ? 'חזרה לעריכה' : 'מצב הקרנה';
  if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
presentBtn.onclick = () => setPresent(!document.body.classList.contains('present'));
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('present')) setPresent(false); });
document.getElementById('printBtn').onclick = () => window.print();
document.getElementById('shareBtn').onclick = async () => {
  const url = location.href.split('#')[0] + '#' + encode(state);
  try { await navigator.clipboard.writeText(url); say('הקישור הועתק – מי שיפתח אותו יראה את השיעור הזה'); }
  catch(e) { prompt('העתיקו את הקישור:', url); }
};
document.getElementById('clearBtn').onclick = () => {
  if (!confirm('לנקות את כל השדות ולהתחיל תבנית חדשה?')) return;
  state = blank(); save(); history.replaceState(null, '', location.pathname);
  document.querySelectorAll('[data-k]').forEach(el => el.innerText = '');
  renderStations(); setMinutes(15);
};
</script>
</body>
</html>
