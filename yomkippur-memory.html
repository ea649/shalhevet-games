<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>משחק זיכרון – הנהגות יום הכיפורים</title>
<style>
  :root{
    --indigo:#4F3795; --magenta:#AA479A; --pink:#EE3461; --cyan:#08B7D5;
    --yellow:#FCB918; --lime:#BCCB33; --orange:#F36F28; --ink:#1B1533;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  html,body{height:100%}
  body{
    height:100dvh; overflow:hidden;
    display:flex; flex-direction:column;
    background:
      radial-gradient(1200px 600px at 80% -10%, #DCEFFC 0%, transparent 60%),
      linear-gradient(165deg,#F6F4FF 0%,#FFFFFF 55%,#FFF3F7 100%);
    font-family:"Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;color:var(--ink);
    padding:clamp(6px,1.4vh,14px) clamp(8px,2vw,20px);
    gap:clamp(4px,1vh,10px);
  }

  header{flex:none;text-align:center}
  h1{
    font-size:clamp(17px,3.1vh,34px);line-height:1.15;
    background:linear-gradient(135deg,#4F3795 0%,#AA479A 55%,#EE3461 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{margin-top:2px;font-size:clamp(11px,1.5vh,16px);color:#6B6486}

  .bar{
    flex:none;display:flex;flex-wrap:wrap;gap:clamp(5px,1vw,10px);
    align-items:center;justify-content:center;
  }
  .stat{
    background:#fff;border:2px solid #E7E2F6;border-radius:14px;
    padding:clamp(3px,.7vh,8px) clamp(8px,1.4vw,15px);
    font-size:clamp(11px,1.5vh,15px);box-shadow:0 4px 12px rgba(79,55,149,.07);
    white-space:nowrap;
  }
  .stat b{color:var(--indigo)}
  button.btn{
    border:0;border-radius:14px;color:#fff;cursor:pointer;
    padding:clamp(4px,.9vh,10px) clamp(11px,1.8vw,20px);
    font-size:clamp(11px,1.5vh,15px);font-family:inherit;
    background:linear-gradient(135deg,#4F3795 0%,#AA479A 100%);
    box-shadow:0 6px 16px rgba(79,55,149,.22);white-space:nowrap;
  }
  button.btn:active{transform:translateY(1px)}
  .bar img{height:clamp(16px,2.4vh,26px);width:auto;opacity:.85}

  /* the board takes exactly the space that is left — never scrolls */
  .board{
    flex:1; min-height:0; width:100%; margin:0 auto;
    display:grid; gap:clamp(4px,.9vh,13px);
    grid-template-columns:repeat(6,1fr);
    grid-template-rows:repeat(4,1fr);
    max-width:min(1100px, calc((100dvh - 150px) * 6 / 4 * 0.75));
  }
  @media (max-width:760px){
    .board{
      grid-template-columns:repeat(4,1fr);
      grid-template-rows:repeat(6,1fr);
      max-width:none;
    }
  }

  .cell{perspective:1000px;min-width:0;min-height:0}
  .card{
    position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.4,.2,.2,1);cursor:pointer;
  }
  .cell.flipped .card, .cell.done .card{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;
    border-radius:clamp(9px,1.5vh,20px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .back{
    background:linear-gradient(135deg,#4F3795 0%,#AA479A 55%,#EE3461 100%);
    color:#fff;box-shadow:0 8px 18px rgba(79,55,149,.20);
  }
  .back span{font-size:clamp(15px,3.4vh,38px);color:var(--yellow)}
  .front{
    transform:rotateY(180deg);background:#fff;border:2px solid #E7E2F6;
    padding:clamp(3px,.8vh,9px) clamp(2px,.5vw,6px);gap:2px;
    box-shadow:0 8px 18px rgba(27,21,51,.10);
  }
  .front img{flex:1;min-height:0;max-width:90%;object-fit:contain}
  .front .nm{
    flex:none;font-size:clamp(7px,1.25vh,14px);text-align:center;
    line-height:1.1;color:#4A4368;
  }
  .cell.done .front{border-color:var(--lime);background:#FAFFF2}
  .cell.done{animation:pop .4s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}

  /* win message floats above the board so it never changes the layout height */
  .win{
    position:fixed;inset:0;display:none;
    align-items:center;justify-content:center;
    background:rgba(27,21,51,.45);backdrop-filter:blur(3px);z-index:20;padding:20px;
  }
  .win.show{display:flex}
  .win .box{
    text-align:center;padding:clamp(20px,4vh,40px) clamp(24px,5vw,54px);
    border-radius:26px;color:#fff;max-width:520px;
    background:linear-gradient(135deg,#4F3795 0%,#AA479A 55%,#EE3461 100%);
    box-shadow:0 20px 50px rgba(27,21,51,.35);
  }
  .win h2{font-size:clamp(20px,3.4vh,34px);line-height:1.25}
  .win p{margin:10px 0 18px;font-size:clamp(14px,2vh,20px);color:rgba(255,255,255,.94)}
  .win button{
    border:0;border-radius:16px;padding:11px 26px;cursor:pointer;
    font-family:inherit;font-size:clamp(14px,2vh,19px);
    background:#fff;color:var(--indigo);font-weight:bold;
  }
</style>
</head>
<body>

<header>
  <h1>מִשְׂחַק זִכָּרוֹן – הַנְהָגוֹת יוֹם הַכִּפּוּרִים</h1>
  <div class="sub">מָצְאוּ אֶת כָּל הַזּוּגוֹת הַמַּתְאִימִים</div>
</header>

<div class="bar">
  <div class="stat">זוּגוֹת: <b id="pairs">0</b> / 12</div>
  <div class="stat">מַהֲלָכִים: <b id="moves">0</b></div>
  <button class="btn" id="again">מִשְׂחָק חָדָשׁ</button>
  <img src="canva/assets/shalhevet-logo.png" alt="שלהבות חב״ד">
</div>

<div class="board" id="board"></div>

<div class="win" id="win">
  <div class="box">
    <h2>כָּל הַכָּבוֹד! מָצָאתֶם אֶת כָּל הַזּוּגוֹת 🎉</h2>
    <p id="winline"></p>
    <button id="againWin">מִשְׂחָק חָדָשׁ</button>
  </div>
</div>

<script>
const BASE = 'canva/yomkippur/img/';
const ITEMS = [
  {f:'beitknesset.png', n:'בֵּית הַכְּנֶסֶת'},
  {f:'shofar.png',      n:'שׁוֹפָר'},
  {f:'se_seuda.png',    n:'סְעוּדָה מַפְסֶקֶת'},
  {f:'ochel.png',       n:'צוֹם'},
  {f:'michtav.png',     n:'גְּמַר חֲתִימָה טוֹבָה'},
  {f:'slippers.png',    n:'נַעֲלֵי בַּד'},
  {f:'kippa.png',       n:'כִּיפָּה'},
  {f:'siddur.png',      n:'סִדּוּר'},
  {f:'tzedaka.png',     n:'קֻפַּת צְדָקָה'},
  {f:'tarnegol.png',    n:'כַּפָּרוֹת בְּתַרְנְגוֹל'},
  {f:'kesef.png',       n:'כַּפָּרוֹת בְּכֶסֶף'},
  {f:'tzitzit.png',     n:'צִיצִית'}
];

const board   = document.getElementById('board');
const elPairs = document.getElementById('pairs');
const elMoves = document.getElementById('moves');
const elWin   = document.getElementById('win');
const elWinLn = document.getElementById('winline');

let first = null, lock = false, pairs = 0, moves = 0;

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function build(){
  board.innerHTML = '';
  elWin.classList.remove('show');
  first = null; lock = false; pairs = 0; moves = 0;
  elPairs.textContent = 0; elMoves.textContent = 0;

  const deck = shuffle(ITEMS.flatMap((it, i) => [{...it, id:i}, {...it, id:i}]));

  deck.forEach(it => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.id = it.id;
    cell.innerHTML =
      '<div class="card">' +
        '<div class="face back"><span>✦</span></div>' +
        '<div class="face front">' +
          '<img src="' + BASE + it.f + '" alt="">' +
          '<div class="nm">' + it.n + '</div>' +
        '</div>' +
      '</div>';
    cell.addEventListener('click', () => pick(cell));
    board.appendChild(cell);
  });
}

function pick(cell){
  if (lock) return;
  if (cell.classList.contains('flipped') || cell.classList.contains('done')) return;

  cell.classList.add('flipped');

  if (!first){ first = cell; return; }

  moves++; elMoves.textContent = moves;

  if (first.dataset.id === cell.dataset.id){
    first.classList.add('done');
    cell.classList.add('done');
    first = null;
    pairs++; elPairs.textContent = pairs;
    if (pairs === ITEMS.length){
      elWinLn.textContent = 'סִיַּמְתֶּם בְּ־' + moves + ' מַהֲלָכִים';
      elWin.classList.add('show');
    }
    return;
  }

  lock = true;
  const a = first; first = null;
  setTimeout(() => {
    a.classList.remove('flipped');
    cell.classList.remove('flipped');
    lock = false;
  }, 850);
}

document.getElementById('again').addEventListener('click', build);
document.getElementById('againWin').addEventListener('click', build);
build();
</script>
</body>
</html>
