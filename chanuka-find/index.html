<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>חפשו ומצאו – חנוכה</title>
<style>
  @font-face{font-family:"Tamlil";src:url("../fonts/FbTamlil-Bold.otf") format("opentype");font-weight:700}
  @font-face{font-family:"TamlilR";src:url("../fonts/FbTamlil-Regular.otf") format("opentype")}
  :root{--indigo:#4F3795;--magenta:#AA479A;--pink:#EE3461;--cyan:#08B7D5;--yellow:#FCB918;--green:#2DBE6C;--ink:#1B1533}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;
    background:radial-gradient(1200px 600px at 80% -10%,#DCEFFC 0%,transparent 60%),linear-gradient(165deg,#F6F4FF 0%,#FFFFFF 55%,#FFF3F7 100%);
    font-family:"TamlilR",sans-serif;color:var(--ink);padding:8px 14px;gap:6px;position:relative}
  button{font-family:"Tamlil",sans-serif}
  .logo-s{position:absolute;top:8px;right:14px;height:clamp(26px,5.5vh,52px);z-index:2}
  h1{font-family:"Tamlil",sans-serif;font-size:clamp(20px,3.4vh,34px);text-align:center;
    background:linear-gradient(135deg,#4F3795 0%,#AA479A 55%,#EE3461 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .task{font-family:"Tamlil",sans-serif;font-size:clamp(16px,2.6vh,26px);text-align:center;color:var(--indigo)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
  .btn{border:0;border-radius:999px;padding:7px 18px;font-size:clamp(14px,2.1vh,19px);cursor:pointer;color:#fff;background:var(--indigo);box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .btn.alt{background:#fff;color:var(--indigo);border:2px solid var(--indigo)}
  .btn.pink{background:var(--pink)}
  .btn.on{background:var(--magenta);color:#fff;border-color:var(--magenta)}
  .count{font-family:"Tamlil",sans-serif;font-size:clamp(20px,3.6vh,36px);background:var(--yellow);color:var(--ink);border-radius:999px;padding:4px 22px;box-shadow:0 4px 0 #D99A00;display:flex;gap:14px;align-items:center}
  .count b{color:var(--green);font-size:1.25em}
  .count i{font-style:normal;color:var(--pink);font-size:1.25em}
  .count.bump{animation:bump .5s}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
  .stage{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  .pic{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(79,55,149,.25);border:4px solid #fff;cursor:crosshair;touch-action:manipulation}
  .pic img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
  .pic svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .ring{fill:none;stroke-width:8;animation:pop .45s ease-out}
  .ring.ok{stroke:var(--green)}
  .ring.gold{stroke:var(--yellow);stroke-width:11}
  .ring.sol{stroke:var(--pink);stroke-dasharray:20 10}
  .tag rect{fill:#fff;stroke:var(--indigo);stroke-width:3}
  .tag text{font-family:"Tamlil",sans-serif;font-size:28px;fill:var(--indigo);text-anchor:middle;dominant-baseline:central}
  .miss{fill:none;stroke:#E53935;stroke-width:7;stroke-linecap:round;animation:fade .9s forwards}
  @keyframes pop{0%{opacity:0}100%{opacity:1}}
  @keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
  .lens{position:absolute;width:240px;height:240px;border-radius:50%;border:5px solid #fff;box-shadow:0 6px 22px rgba(0,0,0,.4);
    pointer-events:none;display:none;background-repeat:no-repeat;z-index:3}
  .top{display:flex;flex-direction:column;gap:6px;align-items:center}
  /* מסך מלא: התמונה ממלאת את המסך והכפתורים צפים מעליה */
  body.full{padding:0;gap:0;background:#1B1533}
  body.full .logo-s,body.full h1{display:none}
  body.full .top{position:static;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 12px;width:100%;background:#fff;padding:4px 10px;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:6}
  body.full .task{font-size:clamp(14px,2vh,20px)}
  body.full .count{font-size:clamp(16px,2.6vh,26px);padding:2px 16px}
  body.full .btn{padding:4px 12px;font-size:clamp(13px,1.8vh,16px)}
  body.full .pic{border:0;border-radius:0}
  /* הודעות */
  .toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:20;pointer-events:none;white-space:nowrap;
    font-family:"Tamlil",sans-serif;font-size:clamp(30px,7vh,72px);color:#fff;background:linear-gradient(135deg,#4F3795,#AA479A 55%,#EE3461);
    padding:14px 44px;border-radius:999px;box-shadow:0 12px 40px rgba(0,0,0,.35);transition:all .3s cubic-bezier(.2,1.6,.4,1)}
  .toast.small{font-size:clamp(20px,4vh,40px);background:#fff;color:var(--indigo);border:4px solid var(--yellow)}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(27,21,51,.45);z-index:15}
  .win .box{background:#fff;border-radius:26px;padding:26px 36px;text-align:center;max-width:580px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .win h2{font-family:"Tamlil",sans-serif;font-size:clamp(30px,5vh,48px);color:var(--pink);margin-bottom:8px}
  .win p{font-size:clamp(17px,2.6vh,23px);line-height:1.5;margin-bottom:16px}
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
</style>
</head>
<body>
<img class="logo-s" src="../canva/kislev/img/shalhevet-logo.png" alt="">

<div class="top">
  <h1 id="gTitle"></h1>
  <div class="task" id="gTask"></div>
  <span class="count" id="gCount"></span>
  <div class="bar">
    <button class="btn alt" id="fullBtn" onclick="toggleFull()">⛶ מָסָךְ מָלֵא</button>
    <button class="btn alt" id="lensBtn" onclick="toggleLens()">🔍 זְכוּכִית מַגְדֶּלֶת</button>
    <button class="btn pink" onclick="showSolution()">✔ פִּתְרוֹן</button>
    <button class="btn" onclick="start((cur+1)%GAMES.length)">דַּף הַבָּא ←</button>
  </div>
</div>
<div class="stage">
  <div class="pic" id="pic">
    <img id="gImg" alt="" draggable="false">
    <svg id="ov" viewBox="0 0 1536 1024"></svg>
    <div class="lens" id="lens"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="win" id="win"><div class="box"><h2>כׇּל הַכָּבוֹד! 🎉</h2><p id="wP"></p>
  <button class="btn" onclick="start((cur+1)%GAMES.length)">דַּף הַבָּא ←</button></div></div>
<canvas id="confetti"></canvas>

<script>
// קואורדינטות בפיקסלים של התמונה המקורית (1536x1024)
const GAMES=[
 {title:'פַּךְ הַשֶּׁמֶן הַטָּהוֹר', img:'img/heichal_v2.jpg',
  task:'מִצְאוּ אֶת כַּד הַשֶּׁמֶן הַטָּהוֹר',
  items:[{x:168,y:833,r:34,label:'כַּד הַשֶּׁמֶן הַטָּהוֹר'}],
  // כדים סגורים בלי חותם — לא כשרים
  decoys:[{x:346,y:155},{x:1343,y:160},{x:1500,y:240},{x:796,y:458},{x:1318,y:640},{x:110,y:783},{x:767,y:910},{x:1290,y:705}],
  decoyMsg:'כַּד סָגוּר – אֲבָל אֵין עָלָיו חוֹתָם',
  winText:'מְצָאתֶם אֶת פַּךְ הַשֶּׁמֶן הַטָּהוֹר עִם חוֹתַם הַכֹּהֵן הַגָּדוֹל – וְנַעֲשָׂה בּוֹ נֵס, וְדָלַק שְׁמוֹנָה יָמִים!'},
 {title:'יְהוּדִים בַּשּׁוּק הַיְּוָנִי', img:'img/shuk_v19.jpg',
  task:'מִצְאוּ בַּשּׁוּק הַיְּוָנִי אֶת הַיְּהוּדִים שֶׁשָּׁמְרוּ עַל סִימְנֵי הַיַּהֲדוּת',
  noun:'יְהוּדִים',
  items:[
   {x:251,y:214,w:46,h:118,label:'כִּפָּה'},
   {x:835,y:201,w:48,h:112,label:'כִּפָּה'},
   {x:1276,y:176,w:54,h:104,label:'טַלִּית'},
   {x:147,y:490,w:60,h:72,label:'סֵפֶר תּוֹרָה'},
   {x:652,y:505,w:54,h:132,label:'כִּפָּה'},
   {x:1215,y:500,w:52,h:130,label:'צְדָקָה'},
   {x:662,y:892,w:64,h:150,label:'מָגֵן דָּוִד'},
   {x:1444,y:866,w:64,h:80,label:'כִּפָּה'}],
  winText:'מְצָאתֶם אֶת כׇּל הַיְּהוּדִים! גַּם בְּתוֹךְ שׁוּק יְוָנִי הֵם שָׁמְרוּ עַל הַמִּצְווֹת.'}
];
GAMES.forEach(g=>g.items.forEach(it=>{if(it.r){it.w=it.h=it.r*2}}));
let cur=0,found,done,lensOn=false,winT;
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||$('ov')).appendChild(e);return e}

function start(i){
  clearTimeout(winT);cur=i;const g=GAMES[i];found=new Set();done=false;
  $('win').style.display='none';$('gTitle').textContent=g.title;$('gTask').textContent=g.task;
  $('gImg').src=g.img;$('ov').innerHTML='';$('lens').style.backgroundImage=`url(${g.img})`;updCount();setTimeout(fit,0);
}
function updCount(){const g=GAMES[cur];
  $('gCount').style.display=g.items.length>1?'':'none';
  const c=$('gCount');c.innerHTML=`<span>✔ מָצָאנוּ: <b>${found.size}</b></span><span>🔍 נִשְׁאַר לִמְצֹא: <i>${g.items.length-found.size}</i></span>`;
  c.classList.remove('bump');void c.offsetWidth;if(found.size)c.classList.add('bump')}

function fit(){const st=document.querySelector('.stage'),w=st.clientWidth,h=st.clientHeight;if(!w||!h)return;
  const W=Math.min(w,h*1.5);$('pic').style.width=W+'px';$('pic').style.height=W/1.5+'px'}
addEventListener('resize',fit);new ResizeObserver(fit).observe(document.querySelector('.stage'));

function toImg(ev){const r=$('pic').getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*1536,y:(ev.clientY-r.top)/r.height*1024}}

$('pic').addEventListener('click',ev=>{
  if(done)return;const g=GAMES[cur],p=toImg(ev);
  const PAD=10;let hit=-1,bd=1e9;g.items.forEach((it,i)=>{const dx=Math.abs(it.x-p.x),dy=Math.abs(it.y-p.y);if(dx<=it.w/2+PAD&&dy<=it.h/2+PAD){const d=Math.hypot(dx/it.w,dy/it.h);if(d<bd){bd=d;hit=i}}});
  if(hit<0){
    if(g.decoys&&g.decoys.some(d=>Math.hypot(d.x-p.x,d.y-p.y)<=30)){toast(g.decoyMsg,true);return}
    miss(p);return}
  if(found.has(hit))return;
  found.add(hit);const it=g.items[hit];
  el('ellipse',{cx:it.x,cy:it.y,rx:it.w/2+10,ry:it.h/2+10,class:'ring '+(g.items.length===1?'gold':'ok')});tag(it,it.label);
  updCount();
  if(found.size===g.items.length)finish();else{toast('כׇּל הַכָּבוֹד! 🎉');confetti(ev.clientX,ev.clientY,70)}
});
function miss(p){const s=20,gEl=el('g',{});el('path',{d:`M${p.x-s} ${p.y-s}L${p.x+s} ${p.y+s}M${p.x+s} ${p.y-s}L${p.x-s} ${p.y+s}`,class:'miss'},gEl);setTimeout(()=>gEl.remove(),950)}
function tag(it,txt){const w=txt.length*14+40,y=it.ty||(it.y-it.h/2-40<30?it.y+it.h/2+40:it.y-it.h/2-40);
  const x=Math.min(1536-w/2-8,Math.max(w/2+8,it.x));const g=el('g',{class:'tag'});
  el('rect',{x:x-w/2,y:y-24,width:w,height:48,rx:24},g);el('text',{x,y},g).textContent=txt}
function toast(txt,small){const t=$('toast');t.textContent=txt;t.classList.toggle('small',!!small);t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),small?1500:1100)}
function finish(){done=true;toast('כׇּל הַכָּבוֹד! 🎉');confetti(innerWidth/2,innerHeight*0.4,280);
  winT=setTimeout(()=>{$('wP').textContent=GAMES[cur].winText;$('win').style.display='flex'},1800)}
function showSolution(){
  const g=GAMES[cur];clearTimeout(winT);$('win').style.display='none';$('ov').innerHTML='';done=true;
  g.items.forEach(it=>{el('ellipse',{cx:it.x,cy:it.y,rx:it.w/2+12,ry:it.h/2+12,class:'ring '+(g.items.length===1?'gold':'sol')});tag(it,it.label)});
  $('gCount').style.display='';$('gCount').textContent='פִּתְרוֹן';
}
// מסך מלא
function toggleFull(){
  const on=!document.body.classList.contains('full');
  document.body.classList.toggle('full',on);$('fullBtn').classList.toggle('on',on);
  try{if(on&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});
      if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(e){}
  setTimeout(fit,80);
}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('full')){document.body.classList.remove('full');$('fullBtn').classList.remove('on')}setTimeout(fit,80)});
// זכוכית מגדלת
function toggleLens(){lensOn=!lensOn;$('lensBtn').classList.toggle('on',lensOn);if(!lensOn)$('lens').style.display='none'}
$('pic').addEventListener('pointermove',ev=>{
  if(!lensOn)return;const L=$('lens'),r=$('pic').getBoundingClientRect(),Z=3,sz=240;
  const lx=ev.clientX-r.left,ly=ev.clientY-r.top;L.style.display='block';
  L.style.left=(lx-sz/2)+'px';L.style.top=(ly-sz/2)+'px';
  L.style.backgroundSize=`${r.width*Z}px ${r.height*Z}px`;
  L.style.backgroundPosition=`${-(lx*Z-sz/2)}px ${-(ly*Z-sz/2)}px`;
});
$('pic').addEventListener('pointerleave',()=>$('lens').style.display='none');
// קונפטי
const cv=$('confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
const COLORS=['#4F3795','#AA479A','#EE3461','#08B7D5','#FCB918','#2DBE6C'];
function confetti(x,y,n){cv.width=innerWidth;cv.height=innerHeight;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*10;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-7,w:6+Math.random()*8,h:4+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:COLORS[i%COLORS.length],life:140+Math.random()*60})}
  if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life-->0&&p.y<cv.height+40);
  for(const p of parts){p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
  raf=parts.length?requestAnimationFrame(tick):0}

start(0);
</script>
</body>
</html>
