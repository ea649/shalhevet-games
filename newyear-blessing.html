:root{
  --cream:#FDF7EC; --card:#FCF5E9;
  --bronze:#6B3F1D; --bronze-mid:#8A6134; --bronze-soft:#9C7B57;
  --gold:#C9A44F; --gold-lo:#A5833A; --gold-hi:#E7CE93;
  --line:rgba(150,110,62,.22);
  --shadow:0 30px 64px -34px rgba(95,60,25,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:'Almoni','Segoe UI',Arial,sans-serif;color:var(--bronze);
  background:
    radial-gradient(90% 60% at 50% 0%,rgba(255,250,240,.85) 0%,rgba(255,250,240,0) 62%),
    linear-gradient(180deg,#F3E7D3 0%,#EBD9BD 48%,#E3CCA9 100%);
  background-attachment:fixed;
  display:flex;align-items:center;justify-content:center;
  padding:26px 16px 46px;position:relative;overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:-20% -10% auto -10%;height:70%;z-index:0;pointer-events:none;
  background:radial-gradient(60% 70% at 30% 30%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%),
             radial-gradient(50% 60% at 78% 18%,rgba(255,244,228,.6),rgba(255,244,228,0) 70%);
  filter:blur(10px);
}
.stage{position:relative;z-index:1;width:100%;max-width:680px}

.card{
  position:relative;background:var(--card);
  border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);
  padding:38px 34px 34px;
}
.screen{display:none;animation:in .55s cubic-bezier(.2,.8,.25,1) both}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.arch{display:block;width:236px;height:118px;margin:0 auto 10px}
.arch path{fill:none;stroke:url(#g);stroke-width:2.2}

.script{font-family:'Ktav','Almoni',cursive;color:var(--bronze-mid);
  font-size:clamp(26px,4.6vw,34px);transform:rotate(-2.2deg);display:inline-block;line-height:1.2}
h1{font-size:clamp(34px,7.4vw,54px);font-weight:900;line-height:1.08;color:var(--bronze);
   letter-spacing:-.5px;margin:6px 0 14px}
h1 .thin{font-weight:400;color:var(--bronze-mid);display:block;font-size:.62em;letter-spacing:0;margin-top:6px}
.lead{font-size:clamp(17px,2.6vw,19.5px);color:var(--bronze-soft);line-height:1.75}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:24px 0}

.field{margin:22px 0 4px}
label{display:block;font-weight:600;font-size:16px;margin-bottom:9px;color:var(--bronze)}
input[type=text],textarea{
  width:100%;font-family:inherit;font-size:17px;color:var(--bronze);
  background:#FFFCF6;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;
  transition:.18s;resize:none;
}
input::placeholder,textarea::placeholder{color:#B49B78}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--gold);background:#fff;
  box-shadow:0 0 0 4px rgba(201,164,79,.16)}
textarea{min-height:62px;line-height:1.6}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:var(--bronze);color:#F7EEDD;border:none;border-radius:999px;
  font-family:inherit;font-size:18.5px;font-weight:600;padding:14px 34px;cursor:pointer;
  box-shadow:0 14px 26px -14px rgba(107,63,29,.8);transition:.18s;
}
.btn:hover{transform:translateY(-2px);background:#5A3418}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--bronze-mid);border:1.5px solid var(--gold);
  box-shadow:none;font-size:16px;padding:12px 24px}
.btn.ghost:hover{background:rgba(201,164,79,.12);color:var(--bronze)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:26px}

.qbadge{position:absolute;top:-16px;left:26px;width:62px;height:62px;border-radius:50%;
  background:var(--bronze);color:#F3E4CC;display:flex;flex-direction:column;align-items:center;
  justify-content:center;line-height:1.05;font-weight:600;box-shadow:0 12px 24px -12px rgba(107,63,29,.9)}
.qbadge b{font-size:21px;font-weight:900}
.qbadge span{font-size:11.5px;opacity:.85}
.pbar{height:5px;background:rgba(150,110,62,.16);border-radius:99px;overflow:hidden;margin:4px 0 24px}
.pfill{height:100%;width:0;border-radius:99px;transition:width .45s cubic-bezier(.3,.9,.3,1);
  background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi),var(--gold))}
h2{font-size:clamp(23px,4.3vw,31px);font-weight:900;line-height:1.35;margin-bottom:20px;color:var(--bronze)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:600px){.opts{grid-template-columns:1fr}.card{padding:30px 20px 26px;border-radius:24px}}
.opt{
  display:flex;align-items:center;gap:11px;text-align:right;
  background:#FFFCF6;border:1.4px solid var(--line);border-radius:16px;padding:14px 15px;
  font-family:inherit;font-size:16.5px;font-weight:600;color:var(--bronze);cursor:pointer;transition:.16s;
}
.opt:hover{border-color:var(--gold);transform:translateY(-2px)}
.opt .em{font-size:22px;line-height:1;filter:saturate(.85)}
.opt.sel{background:var(--bronze);color:#F7EEDD;border-color:var(--bronze);
  box-shadow:0 12px 24px -14px rgba(107,63,29,.95)}
.more{margin-top:18px}
.more label{font-size:15px;color:var(--bronze-soft);font-weight:600}

#screen-loading .card{text-align:center;padding:54px 28px}
.pulse{width:92px;height:92px;margin:0 auto 22px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#F0DDB6,#C9A44F 62%,#A5833A);
  display:flex;align-items:center;justify-content:center;font-size:40px;
  animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,164,79,.5)}70%{box-shadow:0 0 0 28px rgba(201,164,79,0)}100%{box-shadow:0 0 0 0 rgba(201,164,79,0)}}
.wait{font-family:'Ktav','Almoni',cursive;font-size:clamp(30px,6vw,42px);color:var(--bronze);margin-bottom:12px}
.steps{min-height:30px;font-size:18px;color:var(--bronze-soft);font-weight:600;transition:opacity .2s}
.dots{margin-top:18px}
.dots span{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:var(--gold-lo);animation:bl 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}

.rtop{text-align:center;padding-bottom:6px}
.rtop .script{font-size:clamp(28px,5.2vw,38px)}
#rname{font-size:clamp(28px,5.6vw,42px);font-weight:900;color:var(--bronze);margin:2px 0 12px;line-height:1.15}
.trait{display:inline-block;border:1.4px solid var(--gold);color:var(--bronze-mid);
  border-radius:999px;padding:7px 20px;font-size:16.5px;font-weight:600;background:rgba(201,164,79,.09)}
#rbody{margin-top:20px}
#rbody p{font-size:clamp(17px,2.5vw,19px);line-height:1.9;color:#6E5233;margin-bottom:15px}
#rbody p.q{color:var(--bronze);font-weight:600;border-right:2.5px solid var(--gold);
  padding:4px 14px 4px 0;background:linear-gradient(90deg,rgba(201,164,79,.10),transparent);border-radius:0 10px 10px 0}
#rbody p.end{font-weight:900;color:var(--bronze);font-size:clamp(18px,2.9vw,21px);margin-top:20px}
.sig{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);text-align:center;
  font-size:14.5px;color:var(--bronze-soft);letter-spacing:.2px}
.sig b{display:block;font-family:'Ktav','Almoni',cursive;font-size:26px;color:var(--bronze);
  font-weight:400;margin-bottom:6px}
.spark{position:fixed;font-size:17px;pointer-events:none;z-index:5;animation:up 2.8s ease-out forwards;color:var(--gold)}
@keyframes up{0%{opacity:0;transform:translateY(0) scale(.6)}18%{opacity:.95}100%{opacity:0;transform:translateY(-150px) scale(1.1)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(18px);opacity:0;
  background:var(--bronze);color:#F7EEDD;padding:12px 24px;border-radius:999px;font-size:16px;font-weight:600;
  transition:.25s;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.bh{font-size:13px;color:var(--bronze-soft);text-align:right;margin:0 6px 8px 0;opacity:.75}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#A5833A"/><stop offset="50%" stop-color="#E7CE93"/><stop offset="100%" stop-color="#C9A44F"/>
  </linearGradient>
</defs></svg>

<div class="stage">
  <div class="bh">ב״ה</div>

  <!-- ============ INTRO ============ -->
  <section class="screen on" id="screen-intro">
    <div class="card">
      <svg class="arch" viewBox="0 0 180 96"><path d="M18 96 V52 A72 72 0 0 1 162 52 V96"/></svg>
      <div style="text-align:center">
        <span class="script">לאשה יקרה!</span>
        <h1>ברכה אישית<span class="thin">לשנה החדשה</span></h1>
      </div>
      <div class="rule"></div>
      <p class="lead" style="text-align:center">חמש שאלות קטנות — ובסוף ברכה שנכתבת רק בשבילך, לפי מה שענית ולפי מי שאת.</p>
      <div class="field">
        <label for="uname">איך קוראים לך?</label>
        <input type="text" id="uname" autocomplete="off" placeholder="השם שלך (לא חובה)">
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="start">מתחילות ←</button>
      </div>
    </div>
  </section>

  <!-- ============ QUESTION ============ -->
  <section class="screen" id="screen-q">
    <div class="card">
      <div class="qbadge"><b id="pnum">1</b><span id="ptot">מתוך 5</span></div>
      <div class="pbar"><div class="pfill" id="pfill"></div></div>
      <h2 id="qtitle"></h2>
      <div class="opts" id="qopts"></div>
      <div class="more">
        <label for="qfree">רוצה להוסיף במילים שלך?</label>
        <textarea id="qfree" placeholder="אפשר לכתוב כאן משפט משלך… (לא חובה)"></textarea>
      </div>
      <div class="actions">
        <button class="btn" id="next" disabled>הלאה ←</button>
        <button class="btn ghost" id="back">→ חזרה</button>
      </div>
    </div>
  </section>

  <!-- ============ LOADING ============ -->
  <section class="screen" id="screen-loading">
    <div class="card">
      <div class="pulse">💌</div>
      <div class="wait">חכי רגע…</div>
      <div class="steps" id="steps">הבינה רוצה לשלוח לך ברכה לשנה החדשה</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section class="screen" id="screen-result">
    <div class="card">
      <svg class="arch" viewBox="0 0 180 96"><path d="M18 96 V52 A72 72 0 0 1 162 52 V96"/></svg>
      <div class="rtop">
        <span class="script">הברכה שלך</span>
        <div id="rname"></div>
        <span class="trait" id="rtrait"></span>
      </div>
      <div id="rbody"></div>
      <div class="sig">
        <b>שנה טובה ומתוקה</b>
        התחדשי · קבלת פנים למשפחות החדשות
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="share">שליחה בוואטסאפ</button>
        <button class="btn ghost" id="copy">העתקת הברכה</button>
        <button class="btn ghost" id="again">מהתחלה</button>
      </div>
    </div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   השאלות + הטקסטים שמהם מורכבת הברכה
   ============================================================ */
const Q = [
  {
    id:'renew',
    title:'מה מעניק לך תחושה של התחדשות?',
    opts:[
      {em:'🌅',t:'בוקר שקט לפני שכולם קמים',line:'ההתחדשות שלך מתחילה בשקט של בוקר — סימן שאת יודעת שדברים גדולים נולדים דווקא ברגעים הקטנים, ולא ברעש.'},
      {em:'👗',t:'בגד חדש שאני אוהבת',line:'את יודעת שהחוץ נוגע בפְּנים: כשאת מרשה לעצמך משהו יפה, גם משהו בתוכך מתיישר ומתיישב במקום. אל תוותרי על זה.'},
      {em:'💐',t:'זר פרחים על השולחן',line:'יש לך יכולת לעשות יופי מדבר קטן — זר אחד על השולחן, וכל הבית נראה אחרת. זו מתנה שלא לכולן יש.'},
      {em:'🎀',t:'מראה חדש או פינוק קטן',line:'את יודעת שגם את צריכה תשומת לב, לא רק לחלק אותה לאחרים. הפינוק הקטן שלך הוא לא מותרות — הוא דלק.'},
      {em:'☕',t:'רגע לעצמי עם כוס קפה',line:'רגע אחד לבד מספיק לך כדי להתחיל מחדש. היכולת הזו — לאסוף את עצמך בשקט — היא כוח אמיתי.'},
      {em:'💬',t:'שיחה עמוקה עם מישהי קרובה',line:'את מתחדשת דרך אנשים. חיבור אמיתי הוא החמצן שלך, וזה מלמד עלייך שאת יודעת גם לתת לב וגם לקבל.'},
      {em:'🧺',t:'סדר ובית מסודר',line:'כשהחוץ מסודר גם הפְּנים שלך נושמת. היכולת שלך לעשות סדר היא כוח אמיתי, לא סתם הרגל.'},
      {em:'📖',t:'לימוד או רעיון חדש שמאיר לי',line:'רעיון חדש מדליק אותך. הסקרנות הזו שומרת אותך צעירה בלב, והיא זו שתמשיך להוביל אותך רחוק.'},
      {em:'🌿',t:'טיול בטבע ואוויר פתוח',line:'האוויר הפתוח מחזיר אותך לעצמך. את יודעת לצאת רגע מהשגרה כדי לחזור אליה חזקה יותר.'},
      {em:'🕯️',t:'תפילה מהלב',line:'ההתחדשות שלך מגיעה מהמקום הכי אמיתי שיש — משיחה פשוטה עם הקב״ה. זה מקור כוח שלא נגמר.'}
    ],
    echo:t=>'כתבת שההתחדשות שלך היא "'+t+'" — שתמצאי אותה השנה שוב ושוב.'
  },
  {
    id:'more',
    title:'מה היית רוצה להכניס יותר לחייך בשנה החדשה?',
    opts:[
      {em:'✨',t:'שמחה וקלילות',w:'שמחה וקלילות',line:'שתדעי לקחת דברים בקלות, ושהצחוק יגיע אלייך גם בלי סיבה מיוחדת.'},
      {em:'🌊',t:'שקט ונשימה',w:'שקט ונשימה',line:'שיהיה לך זמן לנשום באמצע היום, ושגם הראש שלך יידע לפעמים פשוט לנוח.'},
      {em:'🏡',t:'זמן איכות עם המשפחה',w:'קרבה',line:'שהרגעים עם מי שאת הכי אוהבת יהיו נוכחים באמת — לא בין לבין, ולא בדרך למשהו אחר.'},
      {em:'🌱',t:'צמיחה והתפתחות אישית',w:'צמיחה',line:'שתראי בעיניים שלך את השינוי, ותוכלי להגיד לעצמך: הנה, גדלתי.'},
      {em:'🎨',t:'יצירתיות והבעה',w:'יצירה',line:'שיהיה לך מקום להוציא החוצה את מה שיש בפנים, בלי לחכות שיתפנה זמן.'},
      {em:'💪',t:'ביטחון ואמונה בעצמי',w:'ביטחון',line:'שתאמיני בעצמך באותה עוצמה שבה את מאמינה באחרים.'}
    ],
    echo:t=>'וכשכתבת "'+t+'" — שיהיה לך מזה בשפע, בלי חשבון.'
  },
  {
    id:'door',
    title:'השנה החדשה פותחת לך דלת — לאן היית רוצה שהיא תוביל אותך?',
    opts:[
      {em:'🧭',t:'למקום שבו אני במקום הנכון',line:'שתובילי אל המקום שבו את יודעת בלב שאת בדיוק היכן שצריך להיות — אין שקט גדול מזה.'},
      {em:'🌟',t:'להגשמת חלום שאני נושאת',line:'שהחלום שאת נושאת כבר זמן רב יפסיק להיות חלום, ויתחיל להיות לוח זמנים.'},
      {em:'🕊️',t:'לחיבור עמוק יותר',line:'שהיא תוביל אותך פנימה — לחיבור שקט ואמיתי עם עצמך ועם הקב״ה.'},
      {em:'🏠',t:'לבית מלא אור ושלווה',line:'שהיא תוביל אותך הביתה — לבית שיש בו אור, שלווה, ואנשים שטוב להם בתוכו.'},
      {em:'🤲',t:'להשפעה על אחרים ולנתינה',line:'שהיא תוביל אותך למקומות שבהם תוכלי להשפיע — כי יש לך מה לתת, והעולם באמת צריך את זה.'},
      {em:'🚪',t:'להתחלה חדשה לגמרי',line:'שהיא תוביל אותך להתחלה חדשה — נקייה, אמיצה, ובדיוק בזמן הנכון.'}
    ],
    echo:t=>'ביקשת שהדלת תוביל אותך "'+t+'" — שתיפתח לפנייך לרווחה.'
  },
  {
    id:'light',
    title:'איזה אור את מביאה באופן טבעי לסביבה שלך?',
    opts:[
      {em:'🤍',t:'אור של חום ואכפתיות',w:'נשמה חמה',line:'את מהנשים שנכנסות לחדר והוא מיד נעשה בטוח יותר. האכפתיות שלך לא רועשת — היא פשוט תמיד שם.'},
      {em:'😊',t:'אור של שמחה והומור',w:'שמחה מדבקת',line:'יש לך יכולת נדירה להקל על אנשים בלי שהם בכלל שמים לב. חיוך אחד שלך מוריד לאחרים משקל מהלב.'},
      {em:'🧩',t:'אור של סדר ויציבות',w:'עוגן',line:'את האדם שסביבו הדברים מסתדרים. בלי רעש ובלי הכרזות — פשוט יוצרת סדר במקום שהיה בו בלגן.'},
      {em:'👂',t:'אור של הקשבה והכלה',w:'מקום בטוח',line:'אנשים מספרים לך דברים שהם לא מספרים לאף אחד. זו לא מקריות — זו מתנה של הקשבה אמיתית.'},
      {em:'💡',t:'אור של יצירתיות ורעיונות',w:'ניצוץ',line:'המחשבה שלך הולכת למקומות שאחרים לא חושבים עליהם, ואת מביאה רעננות לכל דבר שאת נוגעת בו.'},
      {em:'🔥',t:'אור של אמונה ותקווה',w:'אור של אמונה',line:'גם כשקשה את מחזיקה את התקווה — לא רק לעצמך, גם לאחרים. זו עוצמה שלא כולם מבינים כמה היא גדולה.'}
    ],
    echo:t=>'וכשתיארת את עצמך "'+t+'" — אל תוותרי על זה אף פעם.'
  },
  {
    id:'gift',
    title:'איזו מתנה היית רוצה שהשנה החדשה תניח על מפתן דלתך?',
    opts:[
      {em:'🍀',t:'בריאות איתנה',line:'בריאות איתנה — לך ולכל מי שיקר לך, ושתדעי רק שמחות.'},
      {em:'👨‍👩‍👧',t:'נחת מהילדים',line:'נחת אמיתית מהילדים — מהסוג שממלא את הלב בשקט טוב.'},
      {em:'🌸',t:'שקט נפשי',line:'שקט נפשי — שהלב שלך יידע גם לנוח, לא רק להחזיק.'},
      {em:'🔑',t:'פרנסה טובה ורווחה',line:'פרנסה טובה ורווחה — בשפע, בכבוד, ובלי דאגות שגונבות את השינה.'},
      {em:'🏆',t:'הצלחה בדרך חדשה',line:'הצלחה בדרך החדשה שלך — שכל דלת שתדפקי עליה תיפתח.'},
      {em:'💗',t:'אהבה וחיבור',line:'אהבה וחיבור — שתרגישי אהובה, ושתדעי לאהוב בקלות.'}
    ],
    echo:t=>'וביקשת "'+t+'" — שתונח לך המתנה הזו על מפתן הדלת ממש.'
  }
];

const ANS = {};
let cur = 0, uname = '';

const $ = s => document.querySelector(s);
const show = id => {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $(id).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
};

$('#start').onclick = () => {
  uname = $('#uname').value.trim().slice(0,24);
  cur = 0; render(); show('#screen-q');
};
$('#uname').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#start').click(); });

function render(){
  const q = Q[cur];
  $('#pnum').textContent = cur+1;
  $('#ptot').textContent = 'מתוך ' + Q.length;
  $('#pfill').style.width = (cur/Q.length*100) + '%';
  $('#qtitle').textContent = q.title;

  const box = $('#qopts'); box.innerHTML = '';
  q.opts.forEach((o,i)=>{
    const b = document.createElement('button');
    b.className = 'opt' + (ANS[cur] && ANS[cur].opt===i ? ' sel' : '');
    b.innerHTML = '<span class="em"></span><span class="tx"></span>';
    b.querySelector('.em').textContent = o.em;
    b.querySelector('.tx').textContent = o.t;
    b.onclick = () => {
      ANS[cur] = ANS[cur] || {}; ANS[cur].opt = i;
      box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      $('#next').disabled = false;
    };
    box.appendChild(b);
  });

  $('#qfree').value = (ANS[cur] && ANS[cur].free) || '';
  $('#next').disabled = !(ANS[cur] && ANS[cur].opt !== undefined);
  $('#next').textContent = (cur === Q.length-1) ? 'קבלת הברכה ←' : 'הלאה ←';
  $('#back').style.display = cur === 0 ? 'none' : 'inline-flex';
}

$('#next').onclick = () => {
  ANS[cur] = ANS[cur] || {};
  ANS[cur].free = $('#qfree').value.trim().slice(0,140);
  if (cur < Q.length-1){ cur++; render(); } else runLoading();
};
$('#back').onclick = () => {
  ANS[cur] = ANS[cur] || {};
  ANS[cur].free = $('#qfree').value.trim().slice(0,140);
  if (cur > 0){ cur--; render(); } else show('#screen-intro');
};

function runLoading(){
  show('#screen-loading');
  const msgs = [
    'הבינה רוצה לשלוח לך ברכה לשנה החדשה',
    'קוראת את התשובות שלך…',
    'מקשיבה למה שכתבת במילים שלך…',
    'מרכיבה ברכה אישית רק בשבילך…'
  ];
  let i = 0;
  $('#steps').textContent = msgs[0];
  const t = setInterval(()=>{
    i++;
    if (i < msgs.length){
      $('#steps').style.opacity = 0;
      setTimeout(()=>{ $('#steps').textContent = msgs[i]; $('#steps').style.opacity = 1; },180);
    } else { clearInterval(t); buildBlessing(); show('#screen-result'); sparkle(); }
  }, 1500);
}

let plainText = '';

function buildBlessing(){
  const pick = i => Q[i].opts[ANS[i].opt];
  const renew = pick(0), more = pick(1), door = pick(2), light = pick(3), gift = pick(4);
  const name = uname || '';

  $('#rname').textContent = name ? name + ' היקרה' : 'ברכה לשנה החדשה';
  $('#rtrait').textContent = 'האור שלך: ' + light.w;

  const paras = [];
  paras.push({c:'', t:(name ? name + ', ' : '') + light.line});
  if (ANS[3].free) paras.push({c:'q', t:Q[3].echo(ANS[3].free)});

  paras.push({c:'', t:renew.line});
  if (ANS[0].free) paras.push({c:'q', t:Q[0].echo(ANS[0].free)});

  paras.push({c:'', t:'השנה הזו רוצה להביא לך ' + more.w + ': ' + more.line});
  if (ANS[1].free) paras.push({c:'q', t:Q[1].echo(ANS[1].free)});

  paras.push({c:'', t:'והדלת שנפתחת לפנייך? ' + door.line});
  if (ANS[2].free) paras.push({c:'q', t:Q[2].echo(ANS[2].free)});

  paras.push({c:'', t:'ועל מפתן הדלת תחכה לך המתנה: ' + gift.line});
  if (ANS[4].free) paras.push({c:'q', t:Q[4].echo(ANS[4].free)});

  paras.push({c:'end', t:'שנה טובה ומתוקה' + (name ? ', ' + name : '') +
    '. שתהיה זו שנה שבה האור שאת נותנת לכולם — יאיר קודם כל לך.'});

  const body = $('#rbody'); body.innerHTML = '';
  paras.forEach((p,i)=>{
    const el = document.createElement('p');
    if (p.c) el.className = p.c;
    el.textContent = p.t;
    el.style.animation = 'in .5s both'; el.style.animationDelay = (i*0.12) + 's';
    body.appendChild(el);
  });

  plainText = 'ברכה לשנה החדשה' + (name ? ' – ' + name : '') + '\n' +
    'האור שלך: ' + light.w + '\n\n' +
    paras.map(p=>p.t).join('\n\n') +
    '\n\nהתחדשי · קבלת פנים למשפחות החדשות';
}

$('#share').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(plainText), '_blank');
$('#copy').onclick = async () => {
  try { await navigator.clipboard.writeText(plainText); toast('הברכה הועתקה ✔'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = plainText;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    toast('הברכה הועתקה ✔');
  }
};
$('#again').onclick = () => {
  for (const k in ANS) delete ANS[k];
  $('#uname').value = uname; cur = 0;
  show('#screen-intro');
};

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 1900);
}

function sparkle(){
  const chars = ['✦','✧','·','✦'];
  for (let i=0;i<16;i++){
    setTimeout(()=>{
      const s = document.createElement('div');
      s.className = 'spark';
      s.textContent = chars[Math.floor(Math.random()*chars.length)];
      s.style.left = (Math.random()*88+6) + 'vw';
      s.style.top  = (Math.random()*45+50) + 'vh';
      document.body.appendChild(s);
      setTimeout(()=>s.remove(), 2900);
    }, i*120);
  }
}
</script>
</body>
</html>
