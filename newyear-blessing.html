:root{
  --indigo:#4F3795; --magenta:#AA479A; --pink:#EE3461; --cyan:#08B7D5; --gold:#FCB918;
  --ink:#1B1533; --ink2:#4A4368; --line:#E7E2F6;
  --grad:linear-gradient(135deg,#4F3795 0%,#AA479A 52%,#EE3461 100%);
  --shadow:0 26px 60px -28px rgba(79,55,149,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:'Jabotinsky','Segoe UI',Arial,sans-serif;
  color:var(--ink);
  background:#F7F5FD;
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px 40px;position:relative;overflow-x:hidden;
}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.42;z-index:0;pointer-events:none;animation:float 18s ease-in-out infinite}
.orb.a{width:420px;height:420px;background:#4F3795;top:-140px;right:-120px}
.orb.b{width:380px;height:380px;background:#EE3461;bottom:-150px;left:-110px;animation-delay:-6s}
.orb.c{width:300px;height:300px;background:#08B7D5;top:40%;left:-140px;animation-delay:-11s;opacity:.3}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-24px,26px) scale(1.08)}}

.stage{position:relative;z-index:1;width:100%;max-width:720px}
.card{
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:34px;box-shadow:var(--shadow);
  padding:38px 34px;
}
.screen{display:none;animation:in .5s cubic-bezier(.2,.8,.25,1) both}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- intro ---------- */
.badge{
  display:inline-flex;align-items:center;gap:8px;background:var(--grad);color:#fff;
  padding:8px 18px;border-radius:999px;font-size:15px;font-weight:600;letter-spacing:.2px;
}
h1{font-size:clamp(32px,6.4vw,50px);font-weight:900;line-height:1.15;margin:18px 0 12px;
   background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(17px,2.6vw,20px);color:var(--ink2);line-height:1.7}
.field{margin:26px 0 6px}
label{display:block;font-weight:600;font-size:16px;margin-bottom:9px;color:var(--ink)}
input[type=text],textarea{
  width:100%;font-family:inherit;font-size:17px;color:var(--ink);
  background:#FBFAFF;border:1.6px solid var(--line);border-radius:18px;padding:14px 16px;
  transition:.18s;resize:none;
}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--magenta);background:#fff;
  box-shadow:0 0 0 4px rgba(170,71,154,.12)}
textarea{min-height:64px;line-height:1.6}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:var(--grad);color:#fff;border:none;border-radius:999px;
  font-family:inherit;font-size:19px;font-weight:700;padding:15px 34px;cursor:pointer;
  box-shadow:0 16px 30px -14px rgba(79,55,149,.75);transition:.18s;
}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:#fff;color:var(--indigo);border:1.6px solid var(--line);box-shadow:none;font-size:16px;padding:12px 24px}
.btn.ghost:hover{border-color:var(--magenta)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}

/* ---------- question ---------- */
.progress{margin-bottom:24px}
.ptop{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--ink2);font-weight:600;margin-bottom:10px}
.pbar{height:9px;background:#EFEBFA;border-radius:99px;overflow:hidden}
.pfill{height:100%;width:0;background:var(--grad);border-radius:99px;transition:width .45s cubic-bezier(.3,.9,.3,1)}
h2{font-size:clamp(23px,4.2vw,32px);font-weight:900;line-height:1.35;margin-bottom:22px;color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.opts{grid-template-columns:1fr}.card{padding:28px 20px;border-radius:26px}}
.opt{
  display:flex;align-items:center;gap:12px;text-align:right;
  background:#FBFAFF;border:1.8px solid var(--line);border-radius:20px;padding:15px 16px;
  font-family:inherit;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer;transition:.16s;
}
.opt:hover{border-color:#C9BEEC;transform:translateY(-2px)}
.opt .em{font-size:23px;line-height:1}
.opt.sel{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 14px 28px -16px rgba(79,55,149,.8)}
.more{margin-top:18px}
.more label{font-size:15px;color:var(--ink2);font-weight:600}

/* ---------- loading ---------- */
#screen-loading .card{text-align:center;padding:60px 30px}
.pulse{width:96px;height:96px;margin:0 auto 26px;border-radius:50%;background:var(--grad);
  display:flex;align-items:center;justify-content:center;font-size:44px;
  box-shadow:0 0 0 0 rgba(170,71,154,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(170,71,154,.45)}70%{box-shadow:0 0 0 30px rgba(170,71,154,0)}100%{box-shadow:0 0 0 0 rgba(170,71,154,0)}}
.wait{font-size:clamp(22px,4vw,30px);font-weight:900;margin-bottom:14px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.steps{min-height:30px;font-size:18px;color:var(--ink2);font-weight:600}
.dots span{display:inline-block;width:9px;height:9px;margin:0 3px;border-radius:50%;background:var(--magenta);animation:bl 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-6px)}}
.dots{margin-top:20px}

/* ---------- result ---------- */
#screen-result .card{padding:0;overflow:hidden}
.rhead{background:var(--grad);color:#fff;padding:34px 32px 30px;text-align:center;position:relative}
.rhead:after{content:"";position:absolute;inset:auto 0 -1px 0;height:34px;background:rgba(255,255,255,.94);
  border-radius:34px 34px 0 0}
.rkicker{font-size:15px;font-weight:600;opacity:.9;letter-spacing:1px}
.rhead h3{font-size:clamp(28px,5.4vw,40px);font-weight:900;margin:8px 0 14px;line-height:1.2}
.trait{display:inline-block;background:rgba(255,255,255,.2);border:1.4px solid rgba(255,255,255,.45);
  border-radius:999px;padding:8px 20px;font-size:17px;font-weight:700}
.rbody{padding:8px 32px 34px}
.rbody p{font-size:clamp(17px,2.5vw,19.5px);line-height:1.85;color:var(--ink2);margin-bottom:16px}
.rbody p.q{color:var(--indigo);font-weight:600;border-right:4px solid var(--pink);
  padding:6px 14px 6px 0;background:linear-gradient(90deg,rgba(238,52,97,.06),transparent);border-radius:0 12px 12px 0}
.rbody p.end{font-weight:700;color:var(--ink);font-size:clamp(18px,2.8vw,21px);margin-top:22px}
.sig{margin-top:26px;padding-top:20px;border-top:1.4px solid var(--line);text-align:center;
  font-size:15px;color:var(--ink2)}
.sig b{display:block;font-size:18px;color:var(--indigo);margin-bottom:3px}
@media(max-width:560px){.rbody{padding:8px 20px 28px}.rhead{padding:28px 20px 26px}}
.spark{position:fixed;font-size:20px;pointer-events:none;z-index:5;animation:up 2.6s ease-out forwards}
@keyframes up{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translateY(-160px) scale(1.15)}}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:#fff;padding:12px 24px;border-radius:999px;font-size:16px;font-weight:600;
  transition:.25s;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

<div class="stage">

  <!-- ============ INTRO ============ -->
  <section class="screen on" id="screen-intro">
    <div class="card">
      <span class="badge">✨ שנה טובה ומתוקה</span>
      <h1>ברכה אישית<br>לשנה החדשה</h1>
      <p class="lead">חמש שאלות קטנות. בסוף — ברכה שנכתבה בשבילך, לפי מה שענית ולפי מי שאת.</p>
      <div class="field">
        <label for="uname">איך קוראים לך?</label>
        <input type="text" id="uname" autocomplete="off" placeholder="השם שלך (לא חובה)">
      </div>
      <div class="actions">
        <button class="btn" id="start">מתחילות ←</button>
      </div>
    </div>
  </section>

  <!-- ============ QUESTION ============ -->
  <section class="screen" id="screen-q">
    <div class="card">
      <div class="progress">
        <div class="ptop"><span id="pnum"></span><span id="ppct"></span></div>
        <div class="pbar"><div class="pfill" id="pfill"></div></div>
      </div>
      <h2 id="qtitle"></h2>
      <div class="opts" id="qopts"></div>
      <div class="more">
        <label for="qfree">רוצה להוסיף במילים שלך?</label>
        <textarea id="qfree" placeholder="אפשר לכתוב כאן משפט משלך… (לא חובה)"></textarea>
      </div>
      <div class="actions">
        <button class="btn" id="next" disabled>הלאה ←</button>
        <button class="btn ghost" id="back">→ חזרה</button>
      </div>
    </div>
  </section>

  <!-- ============ LOADING ============ -->
  <section class="screen" id="screen-loading">
    <div class="card">
      <div class="pulse">💌</div>
      <div class="wait">חכי רגע…</div>
      <div class="steps" id="steps">הבינה רוצה לשלוח לך ברכה לשנה החדשה</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section class="screen" id="screen-result">
    <div class="card">
      <div class="rhead">
        <div class="rkicker">ברכה לשנה החדשה</div>
        <h3 id="rname"></h3>
        <span class="trait" id="rtrait"></span>
      </div>
      <div class="rbody" id="rbody"></div>
      <div class="rbody" style="padding-top:0">
        <div class="sig">
          <b>שנה טובה ומבורכת 🍎🍯</b>
          שלהבות חב״ד · להאמין. להאיר. להצליח.
        </div>
        <div class="actions" style="justify-content:center">
          <button class="btn" id="share">שליחה בוואטסאפ</button>
          <button class="btn ghost" id="copy">העתקת הברכה</button>
          <button class="btn ghost" id="again">מהתחלה</button>
        </div>
      </div>
    </div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   השאלות + הטקסטים שמהם מורכבת הברכה
   ============================================================ */
const Q = [
  {
    id:'renew',
    title:'מה מעניק לך תחושה של התחדשות?',
    opts:[
      {em:'🌅',t:'בוקר שקט לפני שכולם קמים',line:'ההתחדשות שלך מתחילה בשקט של בוקר — סימן שאת יודעת שדברים גדולים נולדים דווקא ברגעים הקטנים, ולא ברעש.'},
      {em:'💬',t:'שיחה עמוקה עם מישהי קרובה',line:'את מתחדשת דרך אנשים. חיבור אמיתי הוא החמצן שלך, וזה מלמד עלייך שאת יודעת גם לתת לב וגם לקבל.'},
      {em:'🧺',t:'סדר ובית מסודר',line:'כשהחוץ מסודר גם הפְּנים שלך נושמת. היכולת שלך לעשות סדר היא כוח אמיתי, לא סתם הרגל.'},
      {em:'📖',t:'לימוד או רעיון חדש שמאיר לי',line:'רעיון חדש מדליק אותך. הסקרנות הזו שומרת אותך צעירה בלב, והיא זו שתמשיך להוביל אותך רחוק.'},
      {em:'🌿',t:'טיול בטבע ואוויר פתוח',line:'האוויר הפתוח מחזיר אותך לעצמך. את יודעת לצאת רגע מהשגרה כדי לחזור אליה חזקה יותר.'},
      {em:'🕯️',t:'תפילה מהלב',line:'ההתחדשות שלך מגיעה מהמקום הכי אמיתי שיש — משיחה פשוטה עם הקב״ה. זה מקור כוח שלא נגמר.'}
    ],
    echo:t=>'כתבת שההתחדשות שלך היא "'+t+'" — שתמצאי אותה השנה שוב ושוב.'
  },
  {
    id:'more',
    title:'מה היית רוצה להכניס יותר לחייך בשנה החדשה?',
    opts:[
      {em:'✨',t:'שמחה וקלילות',w:'שמחה וקלילות',line:'שתדעי לקחת דברים בקלות, ושהצחוק יגיע אלייך גם בלי סיבה מיוחדת.'},
      {em:'🌊',t:'שקט ונשימה',w:'שקט ונשימה',line:'שיהיה לך זמן לנשום באמצע היום, ושגם הראש שלך יידע לפעמים פשוט לנוח.'},
      {em:'🏡',t:'זמן איכות עם המשפחה',w:'קרבה',line:'שהרגעים עם מי שאת הכי אוהבת יהיו נוכחים באמת — לא בין לבין, ולא בדרך למשהו אחר.'},
      {em:'🌱',t:'צמיחה והתפתחות אישית',w:'צמיחה',line:'שתראי בעיניים שלך את השינוי, ותוכלי להגיד לעצמך: הנה, גדלתי.'},
      {em:'🎨',t:'יצירתיות והבעה',w:'יצירה',line:'שיהיה לך מקום להוציא החוצה את מה שיש בפנים, בלי לחכות שיתפנה זמן.'},
      {em:'💪',t:'ביטחון ואמונה בעצמי',w:'ביטחון',line:'שתאמיני בעצמך באותה עוצמה שבה את מאמינה באחרים.'}
    ],
    echo:t=>'וכשכתבת "'+t+'" — שיהיה לך מזה בשפע, בלי חשבון.'
  },
  {
    id:'door',
    title:'השנה החדשה פותחת לך דלת — לאן היית רוצה שהיא תוביל אותך?',
    opts:[
      {em:'🧭',t:'למקום שבו אני במקום הנכון',line:'שתובילי אל המקום שבו את יודעת בלב שאת בדיוק היכן שצריך להיות — אין שקט גדול מזה.'},
      {em:'🌟',t:'להגשמת חלום שאני נושאת',line:'שהחלום שאת נושאת כבר זמן רב יפסיק להיות חלום, ויתחיל להיות לוח זמנים.'},
      {em:'🕊️',t:'לחיבור עמוק יותר',line:'שהיא תוביל אותך פנימה — לחיבור שקט ואמיתי עם עצמך ועם הקב״ה.'},
      {em:'🏠',t:'לבית מלא אור ושלווה',line:'שהיא תוביל אותך הביתה — לבית שיש בו אור, שלווה, ואנשים שטוב להם בתוכו.'},
      {em:'🤲',t:'להשפעה על אחרים ולנתינה',line:'שהיא תוביל אותך למקומות שבהם תוכלי להשפיע — כי יש לך מה לתת, והעולם באמת צריך את זה.'},
      {em:'🚪',t:'להתחלה חדשה לגמרי',line:'שהיא תוביל אותך להתחלה חדשה — נקייה, אמיצה, ובדיוק בזמן הנכון.'}
    ],
    echo:t=>'ביקשת שהדלת תוביל אותך "'+t+'" — שתיפתח לפנייך לרווחה.'
  },
  {
    id:'light',
    title:'איזה אור את מביאה באופן טבעי לסביבה שלך?',
    opts:[
      {em:'🤍',t:'אור של חום ואכפתיות',w:'נשמה חמה',line:'את מהנשים שנכנסות לחדר והוא מיד נעשה בטוח יותר. האכפתיות שלך לא רועשת — היא פשוט תמיד שם.'},
      {em:'😊',t:'אור של שמחה והומור',w:'שמחה מדבקת',line:'יש לך יכולת נדירה להקל על אנשים בלי שהם בכלל שמים לב. חיוך אחד שלך מוריד לאחרים משקל מהלב.'},
      {em:'🧩',t:'אור של סדר ויציבות',w:'עוגן',line:'את האדם שסביבו הדברים מסתדרים. בלי רעש ובלי הכרזות — פשוט יוצרת סדר במקום שהיה בו בלגן.'},
      {em:'👂',t:'אור של הקשבה והכלה',w:'מקום בטוח',line:'אנשים מספרים לך דברים שהם לא מספרים לאף אחד. זו לא מקריות — זו מתנה של הקשבה אמיתית.'},
      {em:'💡',t:'אור של יצירתיות ורעיונות',w:'ניצוץ',line:'המחשבה שלך הולכת למקומות שאחרים לא חושבים עליהם, ואת מביאה רעננות לכל דבר שאת נוגעת בו.'},
      {em:'🔥',t:'אור של אמונה ותקווה',w:'אור של אמונה',line:'גם כשקשה את מחזיקה את התקווה — לא רק לעצמך, גם לאחרים. זו עוצמה שלא כולם מבינים כמה היא גדולה.'}
    ],
    echo:t=>'וכשתיארת את עצמך "'+t+'" — אל תוותרי על זה אף פעם.'
  },
  {
    id:'gift',
    title:'איזו מתנה היית רוצה שהשנה החדשה תניח על מפתן דלתך?',
    opts:[
      {em:'🍀',t:'בריאות איתנה',line:'בריאות איתנה — לך ולכל מי שיקר לך, ושתדעי רק שמחות.'},
      {em:'👨‍👩‍👧',t:'נחת מהילדים',line:'נחת אמיתית מהילדים — מהסוג שממלא את הלב בשקט טוב.'},
      {em:'🌸',t:'שקט נפשי',line:'שקט נפשי — שהלב שלך יידע גם לנוח, לא רק להחזיק.'},
      {em:'🔑',t:'פרנסה טובה ורווחה',line:'פרנסה טובה ורווחה — בשפע, בכבוד, ובלי דאגות שגונבות את השינה.'},
      {em:'🏆',t:'הצלחה בדרך חדשה',line:'הצלחה בדרך החדשה שלך — שכל דלת שתדפקי עליה תיפתח.'},
      {em:'💗',t:'אהבה וחיבור',line:'אהבה וחיבור — שתרגישי אהובה, ושתדעי לאהוב בקלות.'}
    ],
    echo:t=>'וביקשת "'+t+'" — שתונח לך המתנה הזו על מפתן הדלת ממש.'
  }
];

const ANS = {};      // idx -> {opt:number, free:string}
let cur = 0, uname = '';

const $ = s => document.querySelector(s);
const show = id => {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $(id).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
};

/* ---------- intro ---------- */
$('#start').onclick = () => {
  uname = $('#uname').value.trim().slice(0,24);
  cur = 0; render();
  show('#screen-q');
};
$('#uname').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#start').click(); });

/* ---------- question rendering ---------- */
function render(){
  const q = Q[cur];
  $('#pnum').textContent = 'שאלה ' + (cur+1) + ' מתוך ' + Q.length;
  $('#ppct').textContent = Math.round((cur)/Q.length*100) + '%';
  $('#pfill').style.width = ((cur)/Q.length*100) + '%';
  $('#qtitle').textContent = q.title;

  const box = $('#qopts'); box.innerHTML = '';
  q.opts.forEach((o,i)=>{
    const b = document.createElement('button');
    b.className = 'opt' + (ANS[cur] && ANS[cur].opt===i ? ' sel' : '');
    b.innerHTML = '<span class="em"></span><span class="tx"></span>';
    b.querySelector('.em').textContent = o.em;
    b.querySelector('.tx').textContent = o.t;
    b.onclick = () => {
      ANS[cur] = ANS[cur] || {}; ANS[cur].opt = i;
      box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      $('#next').disabled = false;
    };
    box.appendChild(b);
  });

  $('#qfree').value = (ANS[cur] && ANS[cur].free) || '';
  $('#next').disabled = !(ANS[cur] && ANS[cur].opt !== undefined);
  $('#next').textContent = (cur === Q.length-1) ? 'קבלת הברכה ←' : 'הלאה ←';
  $('#back').style.display = cur === 0 ? 'none' : 'inline-flex';
}

$('#next').onclick = () => {
  ANS[cur] = ANS[cur] || {};
  ANS[cur].free = $('#qfree').value.trim().slice(0,140);
  if (cur < Q.length-1){ cur++; render(); }
  else runLoading();
};
$('#back').onclick = () => {
  ANS[cur] = ANS[cur] || {};
  ANS[cur].free = $('#qfree').value.trim().slice(0,140);
  if (cur > 0){ cur--; render(); } else show('#screen-intro');
};

/* ---------- loading ---------- */
function runLoading(){
  show('#screen-loading');
  const msgs = [
    'הבינה רוצה לשלוח לך ברכה לשנה החדשה',
    'קוראת את התשובות שלך…',
    'מקשיבה למה שכתבת במילים שלך…',
    'מרכיבה ברכה אישית רק בשבילך…'
  ];
  let i = 0;
  $('#steps').textContent = msgs[0];
  const t = setInterval(()=>{
    i++;
    if (i < msgs.length){
      $('#steps').style.opacity = 0;
      setTimeout(()=>{ $('#steps').textContent = msgs[i]; $('#steps').style.opacity = 1; },180);
    } else { clearInterval(t); buildBlessing(); show('#screen-result'); sparkle(); }
  }, 1500);
  $('#steps').style.transition = 'opacity .2s';
}

/* ---------- blessing ---------- */
let plainText = '';

function buildBlessing(){
  const pick = i => Q[i].opts[ANS[i].opt];
  const renew = pick(0), more = pick(1), door = pick(2), light = pick(3), gift = pick(4);
  const name = uname || '';

  $('#rname').textContent = name ? name + ' היקרה' : 'הברכה שלך';
  $('#rtrait').textContent = 'האור שלך: ' + light.w;

  const paras = [];
  paras.push({c:'', t: (name ? name + ', ' : '') + light.line});
  if (ANS[3].free) paras.push({c:'q', t: Q[3].echo(ANS[3].free)});

  paras.push({c:'', t: renew.line});
  if (ANS[0].free) paras.push({c:'q', t: Q[0].echo(ANS[0].free)});

  paras.push({c:'', t: 'השנה הזו רוצה להביא לך ' + more.w + ': ' + more.line});
  if (ANS[1].free) paras.push({c:'q', t: Q[1].echo(ANS[1].free)});

  paras.push({c:'', t: 'והדלת שנפתחת לפנייך? ' + door.line});
  if (ANS[2].free) paras.push({c:'q', t: Q[2].echo(ANS[2].free)});

  paras.push({c:'', t: 'ועל מפתן הדלת תחכה לך המתנה: ' + gift.line});
  if (ANS[4].free) paras.push({c:'q', t: Q[4].echo(ANS[4].free)});

  paras.push({c:'end', t:'שנה טובה ומתוקה' + (name ? ', ' + name : '') +
    '. שתהיה זו שנה שבה האור שאת נותנת לכולם — יאיר קודם כל לך. 🍯'});

  const body = $('#rbody'); body.innerHTML = '';
  paras.forEach((p,i)=>{
    const el = document.createElement('p');
    if (p.c) el.className = p.c;
    el.textContent = p.t;
    el.style.animation = 'in .5s both'; el.style.animationDelay = (i*0.12) + 's';
    body.appendChild(el);
  });

  plainText = '✨ ברכה לשנה החדשה ' + (name ? '– ' + name : '') + ' ✨\n' +
    'האור שלך: ' + light.w + '\n\n' +
    paras.map(p=>p.t).join('\n\n') +
    '\n\nשלהבות חב״ד · להאמין. להאיר. להצליח.';
}

/* ---------- actions ---------- */
$('#share').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent(plainText), '_blank');
$('#copy').onclick = async () => {
  try { await navigator.clipboard.writeText(plainText); toast('הברכה הועתקה ✔'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = plainText;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    toast('הברכה הועתקה ✔');
  }
};
$('#again').onclick = () => {
  for (const k in ANS) delete ANS[k];
  $('#uname').value = uname; cur = 0;
  show('#screen-intro');
};

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 1900);
}

function sparkle(){
  const chars = ['✨','🍯','🍎','⭐','💫','🌟'];
  for (let i=0;i<18;i++){
    setTimeout(()=>{
      const s = document.createElement('div');
      s.className = 'spark';
      s.textContent = chars[Math.floor(Math.random()*chars.length)];
      s.style.left = (Math.random()*90+5) + 'vw';
      s.style.top  = (Math.random()*50+45) + 'vh';
      document.body.appendChild(s);
      setTimeout(()=>s.remove(), 2700);
    }, i*110);
  }
}
</script>
</body>
</html>
